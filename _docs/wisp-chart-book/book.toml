[book]
authors = ["wisp-chart authors"]
language = "en"
src = "src"
title = "wisp-chart — opinionated chart compositions on wisp"
description = "Data structs in, scene-graph subtrees out. Gantt first; bar / line / area follow. Same wisp primitives, same fonts, same colour system as the rest of the recording."
text-direction = "ltr"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
no-section-label = false
mathjax-support = false
text-direction = "ltr"
site-url = "/Screen/wisp-chart/"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
additional-css = ["mdbook-admonish.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[preprocessor.links]

[preprocessor.mermaid]
command = "mdbook-mermaid"

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0"

[preprocessor.cmdrun]
command = "mdbook-cmdrun"

# Cross-book shared content + cross-book hyperlinks.
#
# Inside the wisp-chart book:
# - `{{shared path}}` inlines from `_docs/shared/`.
# - `{{wisp-link path}}` emits an absolute URL to `/Screen/wisp/...`.
# - `{{wisp-chart-link path}}` emits a RELATIVE URL inside this book.
[preprocessor.cross]
command = "mdbook-preprocessor-cross"
target = "wisp-chart"
shared-root = "../shared"
wisp-base = "/Screen/wisp"
wisp-chart-base = "/Screen/wisp-chart"
