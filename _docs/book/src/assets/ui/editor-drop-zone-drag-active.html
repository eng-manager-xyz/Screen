<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Editor drop zone — drag active</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <section data-backend="css-fallback" role="region" aria-label="Drop a clip" class="editor-drop-zone editor-drop-zone-active"><div role="img" aria-label="Editor canvas" class="wisp-canvas-host wisp-canvas-host-css-fallback"><div class="wisp-canvas-css"><span class="wisp-canvas-css-label">CSS fallback canvas</span></div></div><div class="editor-drop-zone-content"><span class="editor-drop-zone-icon" aria-hidden="true">⬆</span><span class="editor-drop-zone-headline">Drop a clip to start editing</span><span class="editor-drop-zone-subtext">or press ⌘⇧2 to record one now</span><div class="editor-drop-zone-actions"><button data-id="record" class="editor-drop-zone-action"><span aria-hidden="true" class="editor-drop-zone-action-icon">●</span><span class="editor-drop-zone-action-label">Record screen</span><span class="editor-drop-zone-action-desc">Open the tray recorder</span></button><button data-id="library" class="editor-drop-zone-action"><span aria-hidden="true" class="editor-drop-zone-action-icon">▦</span><span class="editor-drop-zone-action-label">Open library</span><span class="editor-drop-zone-action-desc">Pick a recent recording</span></button><button data-id="file" class="editor-drop-zone-action"><span aria-hidden="true" class="editor-drop-zone-action-icon">📁</span><span class="editor-drop-zone-action-label">Import file</span><span class="editor-drop-zone-action-desc">Choose an MP4 / MOV</span></button><!></div><div aria-label="Recent clips" class="editor-recent-clips"><span class="editor-recent-clips-heading">RECENT CLIPS</span><div class="editor-recent-clips-strip"><button data-id="rec-01" class="editor-recent-clip"><span class="editor-recent-clip-thumb" style="background: linear-gradient(135deg,#1e3a8a,#7c3aed);;"></span><span class="editor-recent-clip-meta"><span class="editor-recent-clip-title">Demo · auth login</span><span class="editor-recent-clip-duration">1m 24s</span></span></button><button data-id="rec-02" class="editor-recent-clip"><span class="editor-recent-clip-thumb" style="background: linear-gradient(135deg,#0f766e,#facc15);;"></span><span class="editor-recent-clip-meta"><span class="editor-recent-clip-title">Standup recap</span><span class="editor-recent-clip-duration">4m 02s</span></span></button><button data-id="rec-03" class="editor-recent-clip"><span class="editor-recent-clip-thumb" style="background: linear-gradient(135deg,#7f1d1d,#f97316);;"></span><span class="editor-recent-clip-meta"><span class="editor-recent-clip-title">Bug repro · payments</span><span class="editor-recent-clip-duration">0m 38s</span></span></button><!></div></div></div></section>
  </body>
</html>
