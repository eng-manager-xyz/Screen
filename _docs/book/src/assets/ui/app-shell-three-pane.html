<!doctype html>
<html lang="en">

      body { padding: 24px; }

  <body>
    <div class="shell-story"><div class="app-shell"><header class="app-shell-titlebar"><span>screen-studio · editor · Recording 02</span></header><div class="app-shell-body"><aside class="app-shell-rail"><nav aria-label="Primary" class="nav-rail"><div class="nav-rail-top"><button title="Personal" aria-haspopup="menu" class="workspace-badge"><span class="workspace-badge-tile" style="background:#ef4444;">PE</span><span class="workspace-badge-chevron" aria-hidden="true">▾</span></button></div><ul role="tablist" class="nav-rail-items"><li><button role="tab" data-section="record" class="nav-rail-item nav-rail-item-record"><span aria-hidden="true" class="nav-rail-icon">●</span><span class="nav-rail-label">Record</span><!></button></li><li><button role="tab" data-section="library" class="nav-rail-item nav-rail-item-library"><span aria-hidden="true" class="nav-rail-icon">▤</span><span class="nav-rail-label">Library</span><!></button></li><li><button role="tab" aria-selected data-section="editor" class="nav-rail-item nav-rail-item-editor nav-rail-item-active"><span aria-hidden="true" class="nav-rail-icon">✎</span><span class="nav-rail-label">Editor</span><!></button></li><li><button role="tab" data-section="cursor" class="nav-rail-item nav-rail-item-cursor"><span aria-hidden="true" class="nav-rail-icon">✛</span><span class="nav-rail-label">Cursor</span><!></button></li><li><button role="tab" data-section="prefs" class="nav-rail-item nav-rail-item-prefs"><span aria-hidden="true" class="nav-rail-icon">⚙</span><span class="nav-rail-label">Prefs</span><!></button></li><!></ul><div class="nav-rail-bottom"><button title="Matthew Harwood" aria-label="Matthew Harwood" class="user-avatar"><span class="user-avatar-monogram">M</span></button></div></nav></aside><main class="app-shell-main"><div class="shell-story-main-placeholder">Main pane — editor canvas / library grid / cursor preview goes here</div></main><aside class="app-shell-inspector"><div class="shell-story-inspector-placeholder"><h3 style="font-size:13px;margin:0 0 8px;color:var(--text-primary)">Inspector</h3><p>Property rows render here in UI-18.</p></div></aside></div><footer class="app-shell-footer"><span>Encoding · 38%   ·   FPS 60</span></footer></div></div>
  </body>
