<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Display preview — 21:9 ultrawide</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div style="padding:8px;width:400px;"><div class="display-preview" style="aspect-ratio: 21 / 9;"><div class="display-preview-titlebar"><span class="display-preview-tlbtn display-preview-tlbtn-red"></span><span class="display-preview-tlbtn display-preview-tlbtn-amber"></span><span class="display-preview-tlbtn display-preview-tlbtn-green"></span></div><div class="display-preview-body"><span class="display-preview-chip" style="left:4%;top:12%;width:42%;height:75%;background:rgba(56, 189, 248, 0.80);;"><span class="display-preview-chip-label">Zoom</span></span><span class="display-preview-chip" style="left:52%;top:12%;width:44%;height:75%;background:rgba(244, 114, 182, 0.65);;"><span class="display-preview-chip-label">Slack</span></span><!><span class="display-preview-overlay">LG 34"</span></div></div></div>
  </body>
</html>
