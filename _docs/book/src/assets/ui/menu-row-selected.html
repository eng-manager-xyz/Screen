<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menu row — selected</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <ul role="menu" aria-label="example" class="menu-list" style="width:260px;padding:6px;background:var(--surface-popover);border:1px solid var(--line-subtle);border-radius:8px;;"><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-selected"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-action">⏵</span></span><span class="menu-row-text"><span class="menu-row-title">Open editor</span><!></span><!><span class="menu-row-trailing"><span class="kbd-row"><kbd class="kbd-key">⌘</kbd><kbd class="kbd-key">O</kbd><!></span></span><span aria-hidden="true" class="menu-row-check">✓</span></button></li></ul>
  </body>
</html>
