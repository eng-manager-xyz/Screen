<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Status bar — error</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="contentinfo" aria-label="Engine status" class="status-bar"><div class="status-cell"><span class="status-key">FPS</span><span class="status-value">0</span></div><div class="status-cell"><span class="status-key">Encoder</span><span class="status-value">H.264</span></div><div class="status-cell"><span class="status-key">Size</span><span class="status-value">12.0 MB</span></div><div class="status-spacer"></div><span class="status-detail">VideoToolbox: out of memory</span><span class="status-pill status-pill-error"><span class="status-pill-dot"></span>Error</span></div>
  </body>
</html>
