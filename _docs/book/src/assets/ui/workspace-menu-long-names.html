<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Workspace switcher — long names truncate</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="dialog" class="popover-surface popover-bl" style="width:320px;"><header class="popover-header"><div class="popover-title">Workspaces</div><div class="popover-description">Switch between your personal and team workspaces.</div></header><div class="popover-body"><ul role="menu" aria-label="Workspaces" class="menu-list"><li role="presentation" class="menu-section"><div class="menu-section-heading">Your workspaces</div><ul role="group" class="menu-section-rows"><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-selected"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace" style="background:#ef4444;">VL</span></span><span class="menu-row-text"><span class="menu-row-title">A very long workspace name that should truncate cleanly in the row</span><span class="menu-row-subtitle">12 members</span></span><span class="menu-row-badges"><span class="badge badge-plan">Team</span><!></span><!><span aria-hidden="true" class="menu-row-check">✓</span></button></li><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace" style="background:#a78bfa;">AL</span></span><span class="menu-row-text"><span class="menu-row-title">Another long workspace name with more words</span><span class="menu-row-subtitle">2 members</span></span><span class="menu-row-badges"><span class="badge badge-plan">Pro</span><!></span><!><!></button></li><!></ul></li><li role="presentation" class="menu-section"><div class="menu-section-heading">Actions</div><ul role="group" class="menu-section-rows"><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-action"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-action">+</span></span><span class="menu-row-text"><span class="menu-row-title">New workspace</span><span class="menu-row-subtitle">Invite teammates after creating</span></span><!><!><!></button></li><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-action">⚙</span></span><span class="menu-row-text"><span class="menu-row-title">Workspace settings</span><!></span><!><!><!></button></li></ul></li></ul></div><footer class="popover-footer"><div class="menu-footer"><span style="font-size:11px;color:var(--text-tertiary);">Workspaces sync across devices.</span></div></footer></div>
  </body>
</html>
