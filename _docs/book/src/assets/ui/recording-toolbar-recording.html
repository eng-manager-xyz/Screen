<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recording toolbar — recording</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="toolbar" aria-label="Recording controls" class="recording-toolbar rec-recording"><div class="rec-status"><span class="rec-dot"></span><span class="rec-status-label">Recording</span></div><div class="rec-timer">02:17</div><div class="rec-source"><span class="rec-source-glyph">⌬</span><span class="rec-source-label">Built-in Display</span></div><div class="rec-actions"><button type="button" class="rec-action rec-action-secondary">Pause</button><button type="button" class="rec-action rec-action-stop">Stop</button></div></div>
  </body>
</html>
