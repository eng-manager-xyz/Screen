<!doctype html>

u-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace" style="background:#10b981;">CD</span></span><span class="menu-row-text"><span class="menu-row-title">Client demos</span><span class="menu-row-subtitle">7 members</span></span><span class="menu-row-badges"><span class="badge badge-plan">Team</span><!></span><!><!></button></li><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace" style="background:#f59e0b;">ON</span></span><span class="menu-row-text"><span class="menu-row-title">Onboarding</span><span class="menu-row-subtitle">1 member</span></span><span class="menu-row-badges"><span class="badge badge-plan">Free</span><!></span><!><!></button></li><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace" style="background:#ec4899;">AQ</span></span><span class="menu-row-text"><span class="menu-row-title">Acquired Brands</span><span class="menu-row-subtitle">21 members</span></span><span class="menu-row-badges"><span class="badge badge-plan">Team</span><!></span><!><!></button></li><!></ul></li><li role="presentation" class="menu-section"><div class="menu-section-heading">Actions</div><ul role="group" class="menu-section-rows"><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-action"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-action">+</span></span><span class="menu-row-text"><span class="menu-row-title">New workspace</span><span class="menu-row-subtitle">Invite teammates after creating</span></span><!><!><!></button></li><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-action">⚙</span></span><span class="menu-row-text"><span class="menu-row-title">Workspace settings</span><!></span><!><!><!></button></li></ul></li></ul></div><footer class="popover-footer"><div class="menu-footer"><span style="font-size:11px;color:var(--text-tertiary);">Workspaces sync across devices.</span></div></footer></div>
