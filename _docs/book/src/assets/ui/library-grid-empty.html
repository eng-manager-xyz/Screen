<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Library grid — empty state</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <section aria-label="Recordings" class="library-grid-host"><div data-layout="grid" class="library-toolbar"><div role="toolbar" aria-label="Filters" class="library-filters"><button data-filter="all" aria-pressed class="library-filter library-filter-active">All</button><button data-filter="tutorial" class="library-filter">Tutorials</button><button data-filter="demo" class="library-filter">Demos</button><button data-filter="bug" class="library-filter">Bug repros</button><!></div><div class="library-toolbar-right"><button class="library-sort">Most recent<!> ▾</button><span role="group" aria-label="Layout" class="library-layout-toggle"><button data-layout="grid" aria-pressed class="library-layout-btn library-layout-btn-active">▦</button><button data-layout="list" class="library-layout-btn">≡</button></span></div></div><div role="status" class="library-empty"><span class="library-empty-icon" aria-hidden="true">⊘</span><span class="library-empty-message">No recordings yet — press ⌘⇧2 to start one.</span></div></section>
  </body>
</html>
