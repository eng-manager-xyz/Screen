<!doctype html>
<html lang="en">

      body { padding: 24px; }

  <body>
    <section data-section="record" data-mode="screen" data-open="none" role="dialog" aria-label="Tray record setup" class="tray-record-popover"><header class="tray-record-header"><button aria-haspopup="dialog" class="tray-record-workspace-chip"><span aria-hidden="true" class="icon-tile icon-tile-workspace">NS</span><span class="tray-record-workspace-label">Northwind Studio</span><span class="tray-record-chevron" aria-hidden="true">▾</span></button><div role="radiogroup" aria-label="Capture mode" class="segmented"><button role="radio" aria-checked data-id="screen" class="segment segment-active"><span aria-hidden="true" class="segment-icon">▢</span><span class="segment-label">Screen</span></button><button role="radio" data-id="window" class="segment"><span aria-hidden="true" class="segment-icon">◫</span><span class="segment-label">Window</span></button><button role="radio" data-id="area" class="segment"><span aria-hidden="true" class="segment-icon">⊞</span><span class="segment-label">Area</span></button><!></div></header><div class="tray-record-body"><section class="tray-record-display"><div class="display-source-card display-source-card-selected"><header class="display-source-header"><div class="display-source-label"><span class="display-source-name">Built-in Retina display</span><span class="display-source-size">14"</span><span aria-label="Favourite" title="Favourite" class="display-source-star">★</span></div><div class="display-source-meta"><span class="display-source-dims">3024 × 1964</span><span aria-hidden="true" class="display-source-chevron">▾</span></div></header><div class="display-preview" style="aspect-ratio: 16 / 10;"><div class="display-preview-titlebar"><span class="display-preview-tlbtn display-preview-tlbtn-red"></span><span class="display-preview-tlbtn display-preview-tlbtn-amber"></span><span class="display-preview-tlbtn display-preview-tlbtn-green"></span></div><div class="display-preview-body"><span class="display-preview-chip" style="left:6%;top:12%;width:56%;height:70%;background:rgba(99, 102, 241, 0.85);;"><span class="display-preview-chip-label">Safari</span></span><span class="display-preview-chip" style="left:56%;top:28%;width:36%;height:50%;background:rgba(15, 15, 15, 0.85);;"><span class="display-preview-chip-label">Terminal</span></span><span class="display-preview-chip" style="left:16%;top:40%;width:32%;height:30%;background:rgba(250, 204, 21, 0.40);;"><span class="display-preview-chip-label">Notes</span></span><!><span class="display-preview-overlay">Built-in 14"</span></div></div><!></div></section><section class="tray-record-sources"><div data-kind="camera" class="capture-source-row"><span class="capture-source-leading"><span aria-hidden="true" class="icon-tile icon-tile-device"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-camera"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg></span></span><span class="capture-source-text"><span class="capture-source-title">FaceTime HD Camera<!></span><span class="capture-source-subtitle">MacBook · 1080p</span></span><!><span class="capture-source-toggle"><button role="switch" aria-checked aria-label="Enable camera" class="toggle toggle-on"><span class="toggle-track"><span class="toggle-knob"></span></span></button></span><button aria-label="Expand device picker" class="capture-source-chevron">▾</button></div><div data-kind="microphone" class="capture-source-row"><span class="capture-source-leading"><span aria-hidden="true" class="icon-tile icon-tile-device"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="lucide lucide-mic"><path d="M12 19v3"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><rect width="6" height="13" x="9" y="2" rx="3"></rect></svg></span></span><span class="capture-source-text"><span class="capture-source-title">MacBook Pro Microphone<span aria-label="Favourite" title="Favourite" class="capture-source-star">★</span></span><span class="capture-source-subtitle">Built-in · 48 kHz</span></span><span class="capture-source-meter"><div role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.35" class="meter"><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><!></div></span><span class="capture-source-toggle"><button role="switch" aria-checked aria-label="Enable microphone" class="toggle toggle-on"><span class="toggle-track"><span class="toggle-knob"></span></span></button></span><button aria-label="Expand device picker" class="capture-source-chevron">▾</button></div></section><section class="tray-record-audio"><div class="system-audio-row"><span class="system-audio-leading"><span class="system-audio-icon-stack"><span aria-hidden="true" class="system-audio-icon" style="background:#16a34a;">S</span><span aria-hidden="true" class="system-audio-icon" style="background:#fbbf24;">C</span><span aria-hidden="true" class="system-audio-icon" style="background:#5865f2;">D</span><!><span aria-label="2 more" class="system-audio-icon-overflow">+2</span></span></span><span class="system-audio-text"><span class="system-audio-title">System audio</span><span class="system-audio-subtitle">2 of 5 apps</span></span><span class="system-audio-toggle"><button role="switch" aria-checked aria-label="Enable system audio" class="toggle toggle-on"><span class="toggle-track"><span class="toggle-knob"></span></span></button></span><button aria-label="Expand system audio app list" class="system-audio-chevron">▾</button></div><!></section><section class="tray-record-on-screen"><button aria-haspopup="dialog" class="tray-record-on-screen-row"><span aria-hidden="true" class="icon-tile icon-tile-action">✦</span><span class="tray-record-on-screen-text"><span class="tray-record-on-screen-title">On-screen</span><span class="tray-record-on-screen-summary">Clean up the desktop, Show keys you press</span></span><span class="tray-record-chevron" aria-hidden="true">▸</span></button></section></div><div data-state="ready" class="recording-controls-footer"><div class="recording-controls-selects"><span class="recording-controls-zoom"><button aria-haspopup="listbox" class="select-pill"><span aria-hidden="true" class="select-pill-icon">⊙</span><span class="select-pill-label">Auto-zoom 2.0×</span><span aria-hidden="true" class="select-pill-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="chevron-down"><path d="m6 9 6 6 6-6"></path></svg></span></button></span><span class="recording-controls-countdown"><button aria-haspopup="listbox" class="select-pill"><span aria-hidden="true" class="select-pill-icon">⏱</span><span class="select-pill-label">3s Countdown</span><span aria-hidden="true" class="select-pill-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="chevron-down"><path d="m6 9 6 6 6-6"></path></svg></span></button></span></div><div class="recording-controls-action"><button type="button" aria-label="Start recording" data-state="ready" class="start-recording-btn start-recording-ready"><span aria-hidden="true" class="start-recording-glyph">●</span><span class="start-recording-label">Start recording</span><span aria-hidden="true" class="shortcut-badges shortcut-badges-on-action"><span class="shortcut-badge">⌘</span><span class="shortcut-badge">⇧</span><span class="shortcut-badge">2</span><!></span></button></div></div><!><!><!><!></section>
  </body>
</html>
