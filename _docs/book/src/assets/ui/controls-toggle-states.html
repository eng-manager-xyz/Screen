<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Controls — toggle switch states</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div class="story-row" style="padding:14px;gap:20px;"><div class="story-row" style="flex-direction:column;align-items:center;gap:6px;"><button role="switch" aria-label="off" class="toggle"><span class="toggle-track"><span class="toggle-knob"></span></span></button><span style="font-size:11px;color:var(--text-tertiary)">Off</span></div><div class="story-row" style="flex-direction:column;align-items:center;gap:6px;"><button role="switch" aria-checked aria-label="on" class="toggle toggle-on"><span class="toggle-track"><span class="toggle-knob"></span></span></button><span style="font-size:11px;color:var(--text-tertiary)">On</span></div><div class="story-row" style="flex-direction:column;align-items:center;gap:6px;"><button role="switch" aria-label="disabled off" disabled class="toggle toggle-disabled"><span class="toggle-track"><span class="toggle-knob"></span></span></button><span style="font-size:11px;color:var(--text-tertiary)">Disabled off</span></div><div class="story-row" style="flex-direction:column;align-items:center;gap:6px;"><button role="switch" aria-checked aria-label="disabled on" disabled class="toggle toggle-on toggle-disabled"><span class="toggle-track"><span class="toggle-knob"></span></span></button><span style="font-size:11px;color:var(--text-tertiary)">Disabled on</span></div></div>
  </body>
</html>
