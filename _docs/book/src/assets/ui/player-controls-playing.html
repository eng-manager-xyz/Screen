<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Player controls — playing mid-clip</title>
    <style>/* ui-storybook — semantic CSS in rust-ui's dark zinc aesthetic.
 *
 * Plain CSS rather than Tailwind to keep the toolchain Rust-only. Class
 * naming intentionally mirrors rust-ui's component class hooks so swapping
 * to Tailwind later is a string replacement, not a rewrite.
 */

:root {
  --bg: #09090b;            /* zinc-950 */
  --bg-elev: #18181b;       /* zinc-900 */
  --bg-row-alt: #1f1f23;
  --fg: #fafafa;            /* zinc-50 */
  --fg-muted: #a1a1aa;      /* zinc-400 */
  --border: #27272a;        /* zinc-800 */
  --border-strong: #3f3f46; /* zinc-700 */
  --accent: #fafafa;
  --accent-fg: #09090b;
  --danger: #ef4444;        /* red-500 */
  --secondary: #27272a;
  --kf-hold: #a1a1aa;
  --kf-linear: #38bdf8;     /* sky-400 */
  --kf-ease: #a78bfa;       /* violet-400 */
  --kf-marker: #facc15;     /* yellow-400 */

  --radius: 6px;
  --radius-sm: 4px;
  --radius-lg: 10px;

  --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  padding: 0;
}

/* ───── Button ───── */
.btn {
  appearance: none;
  border: 1px solid transparent;
  border-radius: var(--radius);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  user-select: none;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sm { padding: 4px 10px; font-size: 12px; height: 28px; }
.btn-md { padding: 6px 14px; font-size: 14px; height: 34px; }
.btn-lg { padding: 8px 18px; font-size: 15px; height: 40px; }

.btn-default { background: var(--accent); color: var(--accent-fg); }
.btn-default:hover:not(:disabled) { background: #e4e4e7; }

.btn-outline { background: transparent; color: var(--fg); border-color: var(--border); }
.btn-outline:hover:not(:disabled) { background: var(--bg-elev); border-color: var(--border-strong); }

.btn-ghost { background: transparent; color: var(--fg); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-elev); }

.btn-destructive { background: var(--danger); color: #fff; }
.btn-destructive:hover:not(:disabled) { background: #dc2626; }

.btn-secondary { background: var(--secondary); color: var(--fg); }
.btn-secondary:hover:not(:disabled) { background: #3f3f46; }

/* ───── Card ───── */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.card-header {
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--border);
}
.card-title { font-size: 15px; font-weight: 600; }
.card-subtitle { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
.card-body { padding: 14px 18px; }

/* ───── Story layout helpers ───── */
.story-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
kbd {
  font-family: var(--font-mono);
  background: var(--secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  font-size: 12px;
}

/* ───── DopeSheet ───── */
.dope-sheet {
  position: relative;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 11px;
  overflow: hidden;
}
.dope-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
}
.dope-row:last-child { border-bottom: 0; }
.dope-row:nth-child(odd) .dope-track { background: var(--bg-row-alt); }
.dope-ruler { background: var(--bg-elev); color: var(--fg-muted); }

.dope-label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-right: 1px solid var(--border);
  background: var(--bg-elev);
}
.dope-label-spacer { background: var(--bg-elev); }
.dope-label-glyph {
  width: 14px;
  height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
}
.dope-label-text { color: var(--fg); }

.dope-track {
  position: relative;
  height: 28px;
}
.dope-ruler-track { height: 22px; }
.dope-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.dope-tick-label {
  position: absolute;
  top: 3px;
  left: 4px;
  font-size: 10px;
  color: var(--fg-muted);
}

.dope-keyframe {
  position: absolute;
  top: 50%;
  width: 8px;
  height: 8px;
  margin-left: -4px;
  margin-top: -4px;
  transform: rotate(45deg);
  background: var(--kf-hold);
  border-radius: 1px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
}
.dope-keyframe.kf-hold { background: var(--kf-hold); }
.dope-keyframe.kf-linear { background: var(--kf-linear); }
.dope-keyframe.kf-ease { background: var(--kf-ease); }
.dope-keyframe.kf-marker {
  background: var(--kf-marker);
  width: 3px;
  height: 22px;
  margin-left: -1.5px;
  margin-top: -11px;
  transform: none;
  border-radius: 1px;
}

.dope-playhead {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: 119px; /* offset past the labels column */
  background: var(--accent);
  box-shadow: 0 0 6px rgba(250, 250, 250, 0.4);
  pointer-events: none;
}

/* ───── DropZone ───── */
.drop-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 56px 32px;
  border-radius: var(--radius-lg);
  text-align: center;
  transition: background 160ms ease, border-color 160ms ease,
              transform 160ms ease;
  user-select: none;
}
.drop-zone-idle {
  background: var(--bg-elev);
  border: 1.5px dashed var(--border-strong);
}
.drop-zone-idle:hover {
  border-color: var(--fg-muted);
  background: #1c1c20;
}
.drop-zone-active {
  background: rgba(56, 189, 248, 0.08);
  border: 1.5px solid var(--kf-linear);
  transform: scale(1.005);
}
.drop-zone-glyph {
  font-size: 42px;
  line-height: 1;
  color: var(--fg-muted);
}
.drop-zone-active .drop-zone-glyph {
  color: var(--kf-linear);
}
.drop-zone-headline {
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
}
.drop-zone-subtext {
  font-size: 13px;
  color: var(--fg-muted);
}
.drop-zone-hint {
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  background: var(--secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
}

/* ───── PlayerControls ───── */
.player-controls {
  display: grid;
  grid-template-columns: 36px auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.player-toggle {
  appearance: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-fg);
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 120ms ease;
}
.player-toggle:hover { transform: scale(1.05); }
.player-toggle-glyph {
  font-size: 11px;
  letter-spacing: -1px;
  line-height: 1;
}
.player-toggle-paused .player-toggle-glyph { padding-left: 2px; /* visual centering */ }
.player-time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg-muted);
  min-width: 38px;
  text-align: center;
}
.player-scrub {
  display: flex;
  align-items: center;
  height: 30px;
}
.player-scrub-track {
  position: relative;
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
}
.player-scrub-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  background: var(--accent);
  border-radius: 2px;
}
.player-scrub-handle {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  margin-top: -6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(250, 250, 250, 0.08);
  transition: box-shadow 120ms ease;
}
.player-scrub-handle:hover {
  box-shadow: 0 0 0 6px rgba(250, 250, 250, 0.14);
}

/* ───── Editor mock composition ───── */
.editor-mock {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
.editor-mock-preview {
  margin-bottom: 12px;
}
.editor-mock-screen {
  aspect-ratio: 16 / 9;
  background:
    linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(167, 139, 250, 0.16)),
    var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  font-family: var(--font-mono);
  font-size: 13px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}

/* track-kind tints (subtle accents on the row backgrounds) */
.track-video .dope-track { background: linear-gradient(0deg, rgba(56, 189, 248, 0.04), rgba(56, 189, 248, 0.04)), var(--bg); }
.track-cursor .dope-track { background: linear-gradient(0deg, rgba(167, 139, 250, 0.04), rgba(167, 139, 250, 0.04)), var(--bg); }
.track-audio .dope-track { background: linear-gradient(0deg, rgba(34, 197, 94, 0.04), rgba(34, 197, 94, 0.04)), var(--bg); }
.track-caption .dope-track { background: linear-gradient(0deg, rgba(250, 204, 21, 0.04), rgba(250, 204, 21, 0.04)), var(--bg); }
.track-effect .dope-track { background: linear-gradient(0deg, rgba(244, 114, 182, 0.04), rgba(244, 114, 182, 0.04)), var(--bg); }
</style>
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="group" aria-label="Player transport" class="player-controls"><button type="button" aria-label="Pause" class="player-toggle player-toggle-playing"><span class="player-toggle-glyph">❚❚</span></button><div data-role="current" class="player-time">0:27</div><div class="player-scrub"><div class="player-scrub-track"><div class="player-scrub-fill" style="width: 32.00%;"></div><div class="player-scrub-handle" style="left: 32.00%;"></div></div></div><div data-role="total" class="player-time">1:24</div></div>
  </body>
</html>
