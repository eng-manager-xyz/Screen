<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Editor toolbar — selected + disabled mix</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="toolbar" aria-label="Editor tools" class="editor-toolbar"><div class="editor-toolbar-actions"><button data-id="16-9" aria-pressed class="editor-action editor-action-selected"><span aria-hidden="true" class="editor-action-icon">▭</span><span class="editor-action-label">16:9</span></button><button data-id="crop" class="editor-action"><span aria-hidden="true" class="editor-action-icon">✂</span><span class="editor-action-label">Crop</span></button><button data-id="annotate" class="editor-action"><span aria-hidden="true" class="editor-action-icon">✎</span><span class="editor-action-label">Annotate</span></button><button data-id="trim" class="editor-action"><span aria-hidden="true" class="editor-action-icon">⎯</span><span class="editor-action-label">Trim</span></button><!></div><div class="editor-toolbar-end"><button disabled class="btn btn-outline btn-sm">Share</button><button class="btn btn-default btn-sm">Export</button></div></div>
  </body>
</html>
