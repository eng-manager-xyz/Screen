<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Capture source — microphone with live meter</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div style="padding:12px;"><div data-kind="microphone" class="capture-source-row"><span class="capture-source-leading"><span aria-hidden="true" class="icon-tile icon-tile-device">🎙</span></span><span class="capture-source-text"><span class="capture-source-title">MacBook Pro Microphone<span aria-label="Favourite" title="Favourite" class="capture-source-star">★</span></span><span class="capture-source-subtitle">Built-in · 48 kHz</span></span><span class="capture-source-meter"><div role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.45" class="meter"><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><!></div></span><span class="capture-source-toggle"><button role="switch" aria-checked aria-label="Enable microphone" class="toggle toggle-on"><span class="toggle-track"><span class="toggle-knob"></span></span></button></span><button aria-label="Expand device picker" class="capture-source-chevron">▾</button></div></div>
  </body>
</html>
