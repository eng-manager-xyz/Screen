<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cursor style picker — all disabled</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <section aria-label="Cursor style" class="cursor-style-picker"><span class="cursor-style-heading">CURSOR STYLE</span><div class="cursor-style-tiles"><button data-style="system" disabled class="cursor-style-tile cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">◖</span><span class="cursor-style-tile-label">System</span></button><button data-style="arrow" aria-pressed disabled class="cursor-style-tile cursor-style-tile-selected cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">➤</span><span class="cursor-style-tile-label">Arrow</span></button><button data-style="soft" disabled class="cursor-style-tile cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">❥</span><span class="cursor-style-tile-label">Soft</span></button><button data-style="dot" disabled class="cursor-style-tile cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">●</span><span class="cursor-style-tile-label">Dot</span></button><button data-style="ring" disabled class="cursor-style-tile cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">○</span><span class="cursor-style-tile-label">Ring</span></button><button data-style="reticle" disabled class="cursor-style-tile cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">⊕</span><span class="cursor-style-tile-label">Reticle</span></button><button data-style="tactile" disabled class="cursor-style-tile cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">◎</span><span class="cursor-style-tile-label">Tactile</span></button><button data-style="hide" disabled class="cursor-style-tile cursor-style-tile-disabled"><span aria-hidden="true" class="cursor-style-tile-preview">∅</span><span class="cursor-style-tile-label">Hide</span></button><!></div></section>
  </body>
</html>
