<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>IconTile — five kinds</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div class="story-row" style="padding:14px;gap:14px;"><div class="story-row" style="flex-direction:column;gap:4px;"><span aria-hidden="true" class="icon-tile icon-tile-workspace">PE</span><span style="font-size:11px;color:var(--text-tertiary)">Workspace</span></div><div class="story-row" style="flex-direction:column;gap:4px;"><span aria-hidden="true" class="icon-tile icon-tile-device">🎙</span><span style="font-size:11px;color:var(--text-tertiary)">Device</span></div><div class="story-row" style="flex-direction:column;gap:4px;"><span aria-hidden="true" class="icon-tile icon-tile-app">S</span><span style="font-size:11px;color:var(--text-tertiary)">App</span></div><div class="story-row" style="flex-direction:column;gap:4px;"><span aria-hidden="true" class="icon-tile icon-tile-action">+</span><span style="font-size:11px;color:var(--text-tertiary)">Action</span></div><div class="story-row" style="flex-direction:column;gap:4px;"><span aria-hidden="true" class="icon-tile icon-tile-user">M</span><span style="font-size:11px;color:var(--text-tertiary)">User</span></div></div>
  </body>
</html>
