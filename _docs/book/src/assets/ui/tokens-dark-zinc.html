<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tokens — semantic surface + text</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div class="token-grid"><div class="token-name">--surface-base</div><div class="token-swatch" style="background:var(--surface-base)"></div><div class="token-value">App background</div><div class="token-name">--surface-elevated</div><div class="token-swatch" style="background:var(--surface-elevated)"></div><div class="token-value">Panels + cards</div><div class="token-name">--surface-popover</div><div class="token-swatch" style="background:var(--surface-popover)"></div><div class="token-value">Menus + popovers</div><div class="token-name">--surface-selected</div><div class="token-swatch" style="background:var(--surface-selected)"></div><div class="token-value">Selected row inside a menu</div><div class="token-name">--text-primary</div><div class="token-swatch" style="background:var(--text-primary)"></div><div class="token-value">Default text colour</div><div class="token-name">--text-secondary</div><div class="token-swatch" style="background:var(--text-secondary)"></div><div class="token-value">Muted labels</div><div class="token-name">--text-tertiary</div><div class="token-swatch" style="background:var(--text-tertiary)"></div><div class="token-value">Footnotes + axis labels</div><div class="token-name">--action-record</div><div class="token-swatch" style="background:var(--action-record)"></div><div class="token-value">Record / destructive action</div></div>
  </body>
</html>
