<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Menu row — device with subtitle + kbd</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <ul role="menu" aria-label="example" class="menu-list" style="width:300px;padding:6px;background:var(--surface-popover);border:1px solid var(--line-subtle);border-radius:8px;;"><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-device">🎙</span></span><span class="menu-row-text"><span class="menu-row-title">AirPods Pro</span><span class="menu-row-subtitle">Bluetooth · 86% battery</span></span><span class="menu-row-badges"><span class="badge badge-live">Live</span><!></span><span class="menu-row-trailing"><span class="kbd-row"><kbd class="kbd-key">⌘</kbd><kbd class="kbd-key">M</kbd><!></span></span><!></button></li></ul>
  </body>
</html>
