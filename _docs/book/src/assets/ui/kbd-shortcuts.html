<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kbd — keyboard shortcut chips</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div class="story-row" style="padding:14px;flex-direction:column;align-items:flex-start;gap:10px;"><div class="story-row"><span style="font-size:12px;color:var(--text-secondary)">Start recording</span><span class="kbd-row"><kbd class="kbd-key">⌘</kbd><kbd class="kbd-key">⇧</kbd><kbd class="kbd-key">R</kbd><!></span></div><div class="story-row"><span style="font-size:12px;color:var(--text-secondary)">Stop recording</span><span class="kbd-row"><kbd class="kbd-key">⌘</kbd><kbd class="kbd-key">⇧</kbd><kbd class="kbd-key">S</kbd><!></span></div><div class="story-row"><span style="font-size:12px;color:var(--text-secondary)">Pause / resume</span><span class="kbd-row"><kbd class="kbd-key">Space</kbd><!></span></div><div class="story-row"><span style="font-size:12px;color:var(--text-secondary)">Open editor</span><span class="kbd-row"><kbd class="kbd-key">⌘</kbd><kbd class="kbd-key">O</kbd><!></span></div></div>
  </body>
</html>
