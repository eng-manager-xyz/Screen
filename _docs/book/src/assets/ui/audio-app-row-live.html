<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Audio app row — live with meter + Suggested</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div style="padding:12px;"><div class="system-audio-applist"><div role="toolbar" aria-label="Filter audio apps" class="system-audio-filters"><button data-filter="all" class="system-audio-filter">All</button><button data-filter="none" class="system-audio-filter">None</button><button data-filter="suggested" aria-pressed class="system-audio-filter system-audio-filter-active">Suggested</button><!></div><ul role="listbox" aria-label="Audio apps" class="system-audio-rows"><li role="option" aria-selected class="audio-app-row audio-app-row-selected audio-app-row-live"><span aria-hidden="true" class="audio-app-check audio-app-check-on">✓</span><span aria-hidden="true" class="audio-app-icon" style="background:#16a34a;">S</span><span class="audio-app-text"><span class="audio-app-name">Spotify</span><span class="audio-app-context">Discover Weekly · 18 m left</span></span><span class="badge badge-accent">Suggested</span><span aria-label="Live audio" class="audio-app-live"><span class="audio-app-live-dot" aria-hidden="true"></span>LIVE</span><span class="audio-app-meter"><div role="meter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0.62" class="meter"><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar meter-bar-on"></span><span class="meter-bar"></span><span class="meter-bar"></span><span class="meter-bar"></span><!></div></span></li><!></ul></div></div>
  </body>
</html>
