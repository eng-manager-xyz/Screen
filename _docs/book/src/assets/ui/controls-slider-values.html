<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Controls — slider matrix</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div style="padding:14px;display:flex;flex-direction:column;gap:14px;width:360px;"><div class="slider"><span class="slider-label">Min</span><div class="slider-track"><div class="slider-fill" style="width:0.00%;"></div><div class="slider-thumb" style="left:0.00%;"></div></div><span class="slider-readout">0%</span></div><div class="slider"><span class="slider-label">Volume</span><div class="slider-track"><div class="slider-fill" style="width:42.00%;"></div><div class="slider-thumb" style="left:42.00%;"></div></div><span class="slider-readout">42%</span></div><div class="slider"><span class="slider-label">Max</span><div class="slider-track"><div class="slider-fill" style="width:100.00%;"></div><div class="slider-thumb" style="left:100.00%;"></div></div><span class="slider-readout">100%</span></div><div class="slider slider-disabled"><span class="slider-label">Disabled</span><div class="slider-track"><div class="slider-fill" style="width:5.00%;"></div><div class="slider-thumb" style="left:5.00%;"></div></div><span class="slider-readout">5.0</span></div></div>
  </body>
</html>
