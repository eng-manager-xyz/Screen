<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Popover — header + menu list</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="dialog" class="popover-surface popover-bl" style="width:280px;"><header class="popover-header"><div class="popover-title">Workspaces</div><div class="popover-description">Switch between your personal and team workspaces.</div></header><div class="popover-body"><ul role="menu" aria-label="Workspaces" class="menu-list"><li role="presentation" class="menu-section"><div class="menu-section-heading">Personal</div><ul role="group" class="menu-section-rows"><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-selected"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace">PE</span></span><span class="menu-row-text"><span class="menu-row-title">Personal</span><!></span><!><!><span aria-hidden="true" class="menu-row-check">✓</span></button></li></ul></li><li role="presentation" class="menu-section"><div class="menu-section-heading">Teams</div><ul role="group" class="menu-section-rows"><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace">AC</span></span><span class="menu-row-text"><span class="menu-row-title">Acme Inc.</span><span class="menu-row-subtitle">3 members</span></span><!><!><!></button></li><li role="none" class="menu-row-item"><button role="menuitem" class="menu-row menu-row-default"><span class="menu-row-leading"><span aria-hidden="true" class="icon-tile icon-tile-workspace">CD</span></span><span class="menu-row-text"><span class="menu-row-title">Client demos</span><!></span><!><!><!></button></li></ul></li></ul></div><!></div>
  </body>
</html>
