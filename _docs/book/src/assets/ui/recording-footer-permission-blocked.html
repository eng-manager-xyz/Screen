<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recording footer — permission blocked</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div data-state="permission-blocked" class="recording-controls-footer"><div class="recording-controls-selects"><span class="recording-controls-zoom"><button aria-haspopup="listbox" class="select-pill"><span aria-hidden="true" class="select-pill-icon">⊙</span><span class="select-pill-label">Auto-zoom 2.0×</span><span class="select-pill-chevron" aria-hidden="true">▾</span></button></span><span class="recording-controls-countdown"><button aria-haspopup="listbox" class="select-pill"><span aria-hidden="true" class="select-pill-icon">⏱</span><span class="select-pill-label">3s Countdown</span><span class="select-pill-chevron" aria-hidden="true">▾</span></button></span></div><div class="recording-controls-action"><button type="button" aria-label="Grant permissions" data-state="permission-blocked" class="start-recording-btn start-recording-permission-blocked"><span aria-hidden="true" class="start-recording-glyph">⚠</span><span class="start-recording-label">Grant permissions</span><!></button></div></div>
  </body>
</html>
