<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Editor drop zone — empty</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <section data-backend="css-fallback" role="region" aria-label="Drop a clip" class="editor-drop-zone"><div role="img" aria-label="Editor canvas" class="wisp-canvas-host wisp-canvas-host-css-fallback"><div class="wisp-canvas-css"><span class="wisp-canvas-css-label">CSS fallback canvas</span></div></div><div class="editor-drop-zone-content"><span class="editor-drop-zone-icon" aria-hidden="true">⬆</span><span class="editor-drop-zone-headline">Drop a clip to start editing</span><span class="editor-drop-zone-subtext">or press ⌘⇧2 to record one now</span><div class="editor-drop-zone-actions"><button data-id="record" class="editor-drop-zone-action"><span aria-hidden="true" class="editor-drop-zone-action-icon">●</span><span class="editor-drop-zone-action-label">Record screen</span><span class="editor-drop-zone-action-desc">Open the tray recorder</span></button><button data-id="library" class="editor-drop-zone-action"><span aria-hidden="true" class="editor-drop-zone-action-icon">▦</span><span class="editor-drop-zone-action-label">Open library</span><span class="editor-drop-zone-action-desc">Pick a recent recording</span></button><button data-id="file" class="editor-drop-zone-action"><span aria-hidden="true" class="editor-drop-zone-action-icon">📁</span><span class="editor-drop-zone-action-label">Import file</span><span class="editor-drop-zone-action-desc">Choose an MP4 / MOV</span></button><!></div><!></div></section>
  </body>
</html>
