<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Display preview — 16:10 single window</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div style="padding:8px;width:260px;"><div class="display-preview" style="aspect-ratio: 16 / 10;"><div class="display-preview-titlebar"><span class="display-preview-tlbtn display-preview-tlbtn-red"></span><span class="display-preview-tlbtn display-preview-tlbtn-amber"></span><span class="display-preview-tlbtn display-preview-tlbtn-green"></span></div><div class="display-preview-body"><span class="display-preview-chip" style="left:22%;top:25%;width:56%;height:55%;background:rgba(15, 15, 15, 0.7);;"><span class="display-preview-chip-label">Finder</span></span><!><!></div></div></div>
  </body>
</html>
