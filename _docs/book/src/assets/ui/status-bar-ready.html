<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Status bar — ready</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="contentinfo" aria-label="Engine status" class="status-bar"><div class="status-cell"><span class="status-key">FPS</span><span class="status-value">60</span></div><div class="status-cell"><span class="status-key">Encoder</span><span class="status-value">H.264 · idle</span></div><div class="status-cell"><span class="status-key">Size</span><span class="status-value">0 B</span></div><div class="status-spacer"></div><!><!--<() />--><span class="status-pill status-pill-ready"><span class="status-pill-dot"></span>Ready</span></div>
  </body>
</html>
