<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recording footer — loading</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div data-state="loading" class="recording-controls-footer"><div class="recording-controls-selects"><span class="recording-controls-zoom"><button aria-haspopup="listbox" class="select-pill"><span aria-hidden="true" class="select-pill-icon">⊙</span><span class="select-pill-label">Auto-zoom 2.0×</span><span aria-hidden="true" class="select-pill-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="chevron-down"><path d="m6 9 6 6 6-6"></path></svg></span></button></span><span class="recording-controls-countdown"><button aria-haspopup="listbox" class="select-pill"><span aria-hidden="true" class="select-pill-icon">⏱</span><span class="select-pill-label">3s Countdown</span><span aria-hidden="true" class="select-pill-chevron"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="chevron-down"><path d="m6 9 6 6 6-6"></path></svg></span></button></span></div><div class="recording-controls-action"><button type="button" aria-label="Starting…" data-state="loading" disabled class="start-recording-btn start-recording-loading"><span aria-hidden="true" class="start-recording-glyph">◌</span><span class="start-recording-label">Starting…</span><!></button></div></div>
  </body>
</html>
