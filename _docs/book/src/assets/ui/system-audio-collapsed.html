    <title>System audio — collapsed row</title>

      body { padding: 24px; }

  <body>
    <div style="padding:12px;"><div class="system-audio-row"><span class="system-audio-leading"><span class="system-audio-icon-stack"><span aria-hidden="true" class="system-audio-icon" style="background:#16a34a;">S</span><span aria-hidden="true" class="system-audio-icon" style="background:#fbbf24;">C</span><!><!></span></span><span class="system-audio-text"><span class="system-audio-title">System audio</span><span class="system-audio-subtitle">2 of 5 apps</span></span><span class="system-audio-toggle"><button role="switch" aria-checked aria-label="Enable system audio" class="toggle toggle-on"><span class="toggle-track"><span class="toggle-knob"></span></span></button></span><button aria-label="Expand system audio app list" class="system-audio-chevron">▾</button></div></div>
