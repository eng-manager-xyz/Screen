<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Audio app row — idle / unselected</title>
    <style>/* ui-storybook — semantic CSS in rust-ui's dark zinc aesthetic.
 *
 * Plain CSS rather than Tailwind to keep the toolchain Rust-only. Class
 * naming intentionally mirrors rust-ui's component class hooks so swapping
 * to Tailwind later is a string replacement, not a rewrite.
 */

:root {
  --bg: #09090b;            /* zinc-950 */
  --bg-elev: #18181b;       /* zinc-900 */
  --bg-row-alt: #1f1f23;
  --fg: #fafafa;            /* zinc-50 */
  --fg-muted: #a1a1aa;      /* zinc-400 */
  --border: #27272a;        /* zinc-800 */
  --border-strong: #3f3f46; /* zinc-700 */
  --accent: #fafafa;
  --accent-fg: #09090b;
  --danger: #ef4444;        /* red-500 */
  --secondary: #27272a;
  --kf-hold: #a1a1aa;
  --kf-linear: #38bdf8;     /* sky-400 */
  --kf-ease: #a78bfa;       /* violet-400 */
  --kf-marker: #facc15;     /* yellow-400 */

  --radius: 6px;
  --radius-sm: 4px;
  --radius-lg: 10px;

  --font-sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;

  /* ── Semantic UI-01 tokens ──────────────────────────────────
   *
   * Aliases for the recurring product surfaces. Components should
   * reach for these instead of the raw `--bg` / `--border` /
   * `--accent` values so the same component reads correctly in
   * popovers, panels, and selected rows. New semantic tokens are
   * added here when a component needs one that isn't yet defined.
   */
  --surface-base: var(--bg);
  --surface-elevated: var(--bg-elev);
  --surface-popover: #131316;
  --surface-selected: #232329;
  --surface-glass: rgba(24, 24, 27, 0.78);

  --text-primary: var(--fg);
  --text-secondary: var(--fg-muted);
  --text-tertiary: #71717a;

  --line-subtle: var(--border);
  --line-strong: var(--border-strong);

  --action-record: var(--danger);
  --action-record-hover: #dc2626;

  --shadow-popover: 0 18px 48px rgba(0, 0, 0, 0.55);
  --shadow-elevated: 0 6px 16px rgba(0, 0, 0, 0.30);

  --radius-panel: var(--radius-lg);
  --radius-control: var(--radius);
  --radius-pill: 999px;

  --focus-ring: 0 0 0 2px rgba(56, 189, 248, 0.55);
}

/* ───── Surface ───── */
.surface {
  border-radius: var(--radius-panel);
}
.surface-base { background: var(--surface-base); }
.surface-elevated {
  background: var(--surface-elevated);
  border: 1px solid var(--line-subtle);
  box-shadow: var(--shadow-elevated);
}
.surface-popover {
  background: var(--surface-popover);
  border: 1px solid var(--line-subtle);
  box-shadow: var(--shadow-popover);
}
.surface-selected {
  background: var(--surface-selected);
  border: 1px solid var(--line-strong);
}
.surface-glass {
  background: var(--surface-glass);
  border: 1px solid var(--line-strong);
  backdrop-filter: blur(12px);
}

/* ───── Badge ───── */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
}
.badge-neutral {
  background: var(--secondary);
  color: var(--text-primary);
}
.badge-accent {
  background: rgba(250, 250, 250, 0.10);
  color: var(--text-primary);
  border: 1px solid var(--line-subtle);
}
.badge-danger {
  background: rgba(239, 68, 68, 0.16);
  color: #f87171;
}
.badge-live {
  background: rgba(239, 68, 68, 0.18);
  color: #fca5a5;
}
.badge-live::before {
  content: "";
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--action-record);
  box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
  animation: rec-pulse 1.4s ease-out infinite;
}
.badge-plan {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--line-subtle);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 10px;
}
.badge-count {
  background: var(--secondary);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 1px 6px;
  min-width: 18px;
  justify-content: center;
}

/* ───── Divider ───── */
.divider {
  background: var(--line-subtle);
}
.divider-h {
  height: 1px;
  width: 100%;
}
.divider-v {
  width: 1px;
  align-self: stretch;
}

/* ───── Kbd row ───── */
.kbd-row {
  display: inline-flex;
  align-items: center;
  gap: 3px;
}
.kbd-key {
  font-family: var(--font-mono);
  background: var(--secondary);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  font-size: 11px;
  color: var(--text-primary);
  line-height: 1.4;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 18px;
}

/* ───── IconTile ───── */
.icon-tile {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border-radius: var(--radius-control);
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-primary);
  flex-shrink: 0;
  border: 1px solid var(--line-subtle);
}
.icon-tile-workspace { background: linear-gradient(135deg, #4338ca, #db2777); color: #fff; border-color: transparent; }
.icon-tile-device    { background: var(--secondary); color: var(--text-secondary); }
.icon-tile-app       { background: #1e293b; color: #e2e8f0; }
.icon-tile-action    { background: var(--surface-elevated); }
.icon-tile-user      { background: #18181b; color: #fafafa; border-radius: 8px; }

/* ───── UI-01 story layout helpers ───── */
.token-grid {
  display: grid;
  grid-template-columns: 220px 80px 1fr;
  gap: 8px 14px;
  align-items: center;
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 14px 18px;
  background: var(--surface-elevated);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-panel);
}
.token-name { color: var(--text-secondary); }
.token-swatch {
  width: 60px;
  height: 20px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--line-subtle);
}
.token-value { color: var(--text-primary); }

.surface-stack {
  display: grid;
  gap: 14px;
  padding: 14px;
  background: var(--surface-base);
  border-radius: var(--radius-panel);
}
.surface-demo {
  padding: 16px 20px;
  font-family: var(--font-sans);
  font-size: 13px;
  color: var(--text-primary);
}

.badge-row { display: inline-flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 14px; }

/* ───── AppShell ───── */
.app-shell {
  display: flex;
  flex-direction: column;
  width: 100%;
  min-height: 480px;
  background: var(--surface-base);
  border-radius: var(--radius-panel);
  overflow: hidden;
  border: 1px solid var(--line-subtle);
}
.app-shell-titlebar {
  padding: 8px 14px;
  background: var(--surface-elevated);
  border-bottom: 1px solid var(--line-subtle);
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--text-secondary);
}
.app-shell-body { flex: 1; display: flex; min-height: 0; }
.app-shell-rail {
  width: 64px;
  background: #0b0b0d;
  border-right: 1px solid var(--line-subtle);
  display: flex;
  flex-direction: column;
}
.app-shell-main {
  flex: 1;
  background: var(--surface-base);
  padding: 18px 22px;
  overflow: auto;
  min-width: 0;
}
.app-shell-inspector {
  width: 280px;
  background: var(--surface-elevated);
  border-left: 1px solid var(--line-subtle);
  padding: 16px 18px;
  overflow: auto;
}
.app-shell-footer {
  background: var(--surface-elevated);
  border-top: 1px solid var(--line-subtle);
  padding: 6px 14px;
  font-size: 12px;
  color: var(--text-secondary);
}

/* ───── NavigationRail ───── */
.nav-rail {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  height: 100%;
  gap: 16px;
  color: var(--text-secondary);
}
.nav-rail-top { display: flex; align-items: center; justify-content: center; }
.nav-rail-bottom { margin-top: auto; padding-bottom: 6px; }
.nav-rail-items {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
  width: 100%;
  align-items: center;
}
.nav-rail-item {
  appearance: none;
  background: transparent;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  width: 48px;
  height: 52px;
  padding: 6px 0 4px;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  position: relative;
  transition: background 120ms ease, color 120ms ease;
}
.nav-rail-item:hover { background: var(--surface-elevated); color: var(--text-primary); }
.nav-rail-item-active {
  background: var(--surface-selected);
  color: var(--text-primary);
  border-color: var(--line-strong);
}
.nav-rail-item-disabled { opacity: 0.4; cursor: not-allowed; }
.nav-rail-icon { font-size: 15px; line-height: 1; }
.nav-rail-label {
  font-size: 10px;
  letter-spacing: 0.04em;
}
.nav-rail-count {
  position: absolute;
  top: 4px;
  right: 4px;
  background: var(--action-record);
  color: #fff;
  font-family: var(--font-mono);
  font-size: 9px;
  line-height: 1;
  padding: 2px 5px;
  border-radius: var(--radius-pill);
  min-width: 14px;
  text-align: center;
}

/* ───── WorkspaceBadge ───── */
.workspace-badge {
  appearance: none;
  background: transparent;
  border: 0;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 3px;
  cursor: pointer;
  color: var(--text-secondary);
}
.workspace-badge-tile {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-control);
  background: var(--action-record);
  color: #fff;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.workspace-badge-chevron {
  font-size: 10px;
  line-height: 1;
  color: var(--text-tertiary);
}
.workspace-badge-open .workspace-badge-chevron { color: var(--text-primary); transform: rotate(180deg); }

/* ───── UserAvatar ───── */
.user-avatar {
  appearance: none;
  background: transparent;
  border: 0;
  padding: 0;
  cursor: pointer;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  overflow: hidden;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.user-avatar-img { width: 100%; height: 100%; object-fit: cover; }
.user-avatar-monogram {
  width: 100%;
  height: 100%;
  background: var(--secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-primary);
  font-size: 12px;
  font-weight: 600;
}

/* ───── App-shell story scaffolding ───── */
.shell-story { width: 720px; height: 460px; }
.shell-story .app-shell { height: 100%; min-height: 0; }
.shell-story-main-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  font-size: 13px;
}
.shell-story-inspector-placeholder {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--text-secondary);
}

html, body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-sans);
  font-size: 14px;
  line-height: 1.5;
  margin: 0;
  padding: 0;
}

/* ───── Button ───── */
.btn {
  appearance: none;
  border: 1px solid transparent;
  border-radius: var(--radius);
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease, opacity 120ms ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  user-select: none;
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sm { padding: 4px 10px; font-size: 12px; height: 28px; }
.btn-md { padding: 6px 14px; font-size: 14px; height: 34px; }
.btn-lg { padding: 8px 18px; font-size: 15px; height: 40px; }

.btn-default { background: var(--accent); color: var(--accent-fg); }
.btn-default:hover:not(:disabled) { background: #e4e4e7; }

.btn-outline { background: transparent; color: var(--fg); border-color: var(--border); }
.btn-outline:hover:not(:disabled) { background: var(--bg-elev); border-color: var(--border-strong); }

.btn-ghost { background: transparent; color: var(--fg); }
.btn-ghost:hover:not(:disabled) { background: var(--bg-elev); }

.btn-destructive { background: var(--danger); color: #fff; }
.btn-destructive:hover:not(:disabled) { background: #dc2626; }

.btn-secondary { background: var(--secondary); color: var(--fg); }
.btn-secondary:hover:not(:disabled) { background: #3f3f46; }

/* ───── Card ───── */
.card {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.card-header {
  padding: 14px 18px 10px;
  border-bottom: 1px solid var(--border);
}
.card-title { font-size: 15px; font-weight: 600; }
.card-subtitle { font-size: 12px; color: var(--fg-muted); margin-top: 2px; }
.card-body { padding: 14px 18px; }

/* ───── Story layout helpers ───── */
.story-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
kbd {
  font-family: var(--font-mono);
  background: var(--secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 1px 6px;
  font-size: 12px;
}

/* ───── DopeSheet ───── */
.dope-sheet {
  position: relative;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--font-mono);
  font-size: 11px;
  overflow: hidden;
}
.dope-row {
  display: grid;
  grid-template-columns: 120px 1fr;
  align-items: stretch;
  border-bottom: 1px solid var(--border);
}
.dope-row:last-child { border-bottom: 0; }
.dope-row:nth-child(odd) .dope-track { background: var(--bg-row-alt); }
.dope-ruler { background: var(--bg-elev); color: var(--fg-muted); }

.dope-label {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 10px;
  border-right: 1px solid var(--border);
  background: var(--bg-elev);
}
.dope-label-spacer { background: var(--bg-elev); }
.dope-label-glyph {
  width: 14px;
  height: 14px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
}
.dope-label-text { color: var(--fg); }

.dope-track {
  position: relative;
  height: 28px;
}
.dope-ruler-track { height: 22px; }
.dope-tick {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.dope-tick-label {
  position: absolute;
  top: 3px;
  left: 4px;
  font-size: 10px;
  color: var(--fg-muted);
}

.dope-keyframe {
  position: absolute;
  top: 50%;
  width: 8px;
  height: 8px;
  margin-left: -4px;
  margin-top: -4px;
  transform: rotate(45deg);
  background: var(--kf-hold);
  border-radius: 1px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4);
}
.dope-keyframe.kf-hold { background: var(--kf-hold); }
.dope-keyframe.kf-linear { background: var(--kf-linear); }
.dope-keyframe.kf-ease { background: var(--kf-ease); }
.dope-keyframe.kf-marker {
  background: var(--kf-marker);
  width: 3px;
  height: 22px;
  margin-left: -1.5px;
  margin-top: -11px;
  transform: none;
  border-radius: 1px;
}

.dope-playhead {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: 119px; /* offset past the labels column */
  background: var(--accent);
  box-shadow: 0 0 6px rgba(250, 250, 250, 0.4);
  pointer-events: none;
}

/* ───── DropZone ───── */
.drop-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 56px 32px;
  border-radius: var(--radius-lg);
  text-align: center;
  transition: background 160ms ease, border-color 160ms ease,
              transform 160ms ease;
  user-select: none;
}
.drop-zone-idle {
  background: var(--bg-elev);
  border: 1.5px dashed var(--border-strong);
}
.drop-zone-idle:hover {
  border-color: var(--fg-muted);
  background: #1c1c20;
}
.drop-zone-active {
  background: rgba(56, 189, 248, 0.08);
  border: 1.5px solid var(--kf-linear);
  transform: scale(1.005);
}
.drop-zone-glyph {
  font-size: 42px;
  line-height: 1;
  color: var(--fg-muted);
}
.drop-zone-active .drop-zone-glyph {
  color: var(--kf-linear);
}
.drop-zone-headline {
  font-size: 16px;
  font-weight: 600;
  color: var(--fg);
}
.drop-zone-subtext {
  font-size: 13px;
  color: var(--fg-muted);
}
.drop-zone-hint {
  margin-top: 8px;
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--fg-muted);
  background: var(--secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 2px 8px;
}

/* ───── PlayerControls ───── */
.player-controls {
  display: grid;
  grid-template-columns: 36px auto 1fr auto;
  gap: 12px;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.player-toggle {
  appearance: none;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--accent-fg);
  border: 0;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: transform 120ms ease;
}
.player-toggle:hover { transform: scale(1.05); }
.player-toggle-glyph {
  font-size: 11px;
  letter-spacing: -1px;
  line-height: 1;
}
.player-toggle-paused .player-toggle-glyph { padding-left: 2px; /* visual centering */ }
.player-time {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--fg-muted);
  min-width: 38px;
  text-align: center;
}
.player-scrub {
  display: flex;
  align-items: center;
  height: 30px;
}
.player-scrub-track {
  position: relative;
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
}
.player-scrub-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  background: var(--accent);
  border-radius: 2px;
}
.player-scrub-handle {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  margin-left: -6px;
  margin-top: -6px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(250, 250, 250, 0.08);
  transition: box-shadow 120ms ease;
}
.player-scrub-handle:hover {
  box-shadow: 0 0 0 6px rgba(250, 250, 250, 0.14);
}

/* ───── Editor mock composition ───── */
.editor-mock {
  display: grid;
  grid-template-columns: 1fr;
  gap: 14px;
}
.editor-mock-preview {
  margin-bottom: 12px;
}
.editor-mock-screen {
  aspect-ratio: 16 / 9;
  background:
    linear-gradient(135deg, rgba(56, 189, 248, 0.16), rgba(167, 139, 250, 0.16)),
    var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--fg-muted);
  font-family: var(--font-mono);
  font-size: 13px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
}

/* ───── RecordingToolbar ───── */
.recording-toolbar {
  display: grid;
  grid-template-columns: auto auto 1fr auto;
  gap: 14px;
  align-items: center;
  padding: 10px 14px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
}
.rec-status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--fg-muted);
}
.rec-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--fg-muted);
  display: inline-block;
}
.rec-recording .rec-dot:not(.rec-dot-static) {
  background: var(--danger);
  box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
  animation: rec-pulse 1.4s ease-out infinite;
}
.rec-paused .rec-dot:not(.rec-dot-static) {
  background: var(--kf-marker);
}
.rec-status-label {
  font-weight: 500;
}
.rec-recording .rec-status-label { color: var(--danger); }
.rec-paused .rec-status-label { color: var(--kf-marker); }
.rec-timer {
  font-family: var(--font-mono);
  font-size: 14px;
  color: var(--fg);
  min-width: 60px;
}
.rec-source {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--fg-muted);
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px 10px;
  justify-self: start;
}
.rec-source-glyph {
  color: var(--kf-linear);
  font-size: 14px;
  line-height: 1;
}
.rec-actions {
  display: flex;
  gap: 8px;
}
.rec-action {
  appearance: none;
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 6px 14px;
  font: inherit;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: background 120ms ease;
}
.rec-action-primary {
  background: var(--danger);
  color: #fff;
}
.rec-action-primary:hover { background: #dc2626; }
.rec-action-primary .rec-dot-static {
  background: #fff;
}
.rec-action-secondary {
  background: var(--secondary);
  color: var(--fg);
}
.rec-action-secondary:hover { background: #3f3f46; }
.rec-action-stop {
  background: transparent;
  color: var(--fg);
  border-color: var(--border);
}
.rec-action-stop:hover {
  background: var(--bg-elev);
  border-color: var(--border-strong);
}

@keyframes rec-pulse {
  0%   { box-shadow: 0 0 0 0   rgba(239, 68, 68, 0.5); }
  70%  { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
  100% { box-shadow: 0 0 0 0   rgba(239, 68, 68, 0); }
}

/* ───── StatusBar ───── */
.status-bar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 6px 14px;
  background: var(--bg-elev);
  border-top: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12px;
  font-family: var(--font-mono);
  color: var(--fg-muted);
}
.status-cell {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
}
.status-key {
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.05em;
  color: #71717a;
}
.status-value {
  color: var(--fg);
}
.status-spacer { flex: 1; }
.status-detail {
  font-size: 12px;
  color: var(--fg-muted);
}
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  border-radius: 999px;
  font-family: var(--font-sans);
  font-size: 11px;
  font-weight: 500;
}
.status-pill-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
}
.status-pill-ready { background: rgba(34, 197, 94, 0.12); color: #4ade80; }
.status-pill-ready .status-pill-dot { background: #4ade80; }
.status-pill-busy { background: rgba(56, 189, 248, 0.12); color: var(--kf-linear); }
.status-pill-busy .status-pill-dot {
  background: var(--kf-linear);
  box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.5);
  animation: rec-pulse 1.4s ease-out infinite;
}
.status-pill-error { background: rgba(239, 68, 68, 0.14); color: #f87171; }
.status-pill-error .status-pill-dot { background: var(--danger); }

/* track-kind tints (subtle accents on the row backgrounds) */
.track-video .dope-track { background: linear-gradient(0deg, rgba(56, 189, 248, 0.04), rgba(56, 189, 248, 0.04)), var(--bg); }
.track-cursor .dope-track { background: linear-gradient(0deg, rgba(167, 139, 250, 0.04), rgba(167, 139, 250, 0.04)), var(--bg); }
.track-audio .dope-track { background: linear-gradient(0deg, rgba(34, 197, 94, 0.04), rgba(34, 197, 94, 0.04)), var(--bg); }
.track-caption .dope-track { background: linear-gradient(0deg, rgba(250, 204, 21, 0.04), rgba(250, 204, 21, 0.04)), var(--bg); }
.track-effect .dope-track { background: linear-gradient(0deg, rgba(244, 114, 182, 0.04), rgba(244, 114, 182, 0.04)), var(--bg); }

/* ───── PopoverSurface (UI-03) ───── */
.popover-surface {
  background: var(--surface-popover);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-panel);
  box-shadow: var(--shadow-popover);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: var(--font-sans);
}
.popover-header {
  padding: 12px 14px 8px;
  border-bottom: 1px solid var(--line-subtle);
}
.popover-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.popover-description { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }
.popover-body { padding: 6px; }
.popover-footer {
  padding: 8px 12px;
  border-top: 1px solid var(--line-subtle);
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--surface-elevated);
}

/* ───── MenuList ───── */
.menu-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }

/* ───── MenuSection ───── */
.menu-section { display: contents; }
.menu-section-heading {
  text-transform: uppercase;
  font-size: 10px;
  letter-spacing: 0.08em;
  color: var(--text-tertiary);
  padding: 8px 10px 4px;
}
.menu-section-rows { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 2px; }

/* ───── MenuRow ───── */
.menu-row-item { list-style: none; }
.menu-row {
  appearance: none;
  border: 0;
  background: transparent;
  width: 100%;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius-control);
  font: inherit;
  color: var(--text-primary);
  cursor: pointer;
  text-align: left;
  transition: background 120ms ease;
  position: relative;
}
.menu-row:hover:not(:disabled) { background: var(--surface-elevated); }
.menu-row-selected { background: var(--surface-selected); }
.menu-row-action .menu-row-title { font-weight: 600; }
.menu-row-danger { color: #f87171; }
.menu-row-disabled { opacity: 0.45; cursor: not-allowed; }

.menu-row-leading { flex-shrink: 0; display: inline-flex; align-items: center; }
.menu-row-text { flex: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.menu-row-title { font-size: 13px; color: var(--text-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-row-subtitle { font-size: 11px; color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.menu-row-badges { display: inline-flex; gap: 6px; flex-shrink: 0; }
.menu-row-trailing {
  display: inline-flex;
  align-items: center;
  color: var(--text-secondary);
  font-family: var(--font-mono);
  font-size: 11px;
  flex-shrink: 0;
}
.menu-row-check { color: var(--text-primary); font-size: 11px; margin-left: 4px; }

.menu-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  gap: 8px;
  font-size: 12px;
  color: var(--text-secondary);
}

/* ───── IconButton (UI-04) ───── */
.icon-btn {
  appearance: none;
  border: 1px solid transparent;
  border-radius: var(--radius-control);
  width: 32px;
  height: 32px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font: inherit;
  cursor: pointer;
  color: var(--text-secondary);
  background: transparent;
  transition: background 120ms ease, color 120ms ease;
}
.icon-btn:hover:not(:disabled) { background: var(--surface-elevated); color: var(--text-primary); }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.icon-btn-pressed { background: var(--surface-selected); color: var(--text-primary); border-color: var(--line-strong); }
.icon-btn-filled { background: var(--secondary); color: var(--text-primary); }
.icon-btn-danger { background: var(--action-record); color: #fff; }
.icon-btn-danger:hover:not(:disabled) { background: var(--action-record-hover); }

/* ───── ToggleSwitch ───── */
.toggle {
  appearance: none;
  border: 0;
  background: transparent;
  padding: 0;
  cursor: pointer;
}
.toggle:disabled { cursor: not-allowed; }
.toggle-track {
  display: inline-block;
  width: 32px;
  height: 18px;
  background: var(--secondary);
  border-radius: 999px;
  position: relative;
  transition: background 120ms ease;
}
.toggle-knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  background: var(--text-primary);
  border-radius: 50%;
  transition: transform 160ms ease;
}
.toggle-on .toggle-track { background: var(--text-primary); }
.toggle-on .toggle-knob { background: #09090b; transform: translateX(14px); }
.toggle-disabled { opacity: 0.45; }

/* ───── SegmentedControl ───── */
.segmented {
  display: inline-flex;
  background: var(--secondary);
  border-radius: var(--radius-pill);
  padding: 3px;
  gap: 2px;
}
.segment {
  appearance: none;
  border: 0;
  background: transparent;
  font: inherit;
  padding: 4px 12px;
  border-radius: var(--radius-pill);
  color: var(--text-secondary);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.segment:hover:not(:disabled) { color: var(--text-primary); }
.segment-active { background: var(--text-primary); color: #09090b; }
.segment-active:hover { color: #09090b; }
.segment-disabled { opacity: 0.4; cursor: not-allowed; }
.segment-icon { font-size: 12px; line-height: 1; }

/* ───── Slider ───── */
.slider {
  display: grid;
  grid-template-columns: 80px 1fr 40px;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  color: var(--text-secondary);
}
.slider-label { white-space: nowrap; }
.slider-track {
  position: relative;
  height: 4px;
  background: var(--secondary);
  border-radius: 999px;
}
.slider-fill {
  position: absolute;
  top: 0;
  bottom: 0;
  left: 0;
  background: var(--text-primary);
  border-radius: 999px;
}
.slider-thumb {
  position: absolute;
  top: 50%;
  width: 12px;
  height: 12px;
  margin: -6px 0 0 -6px;
  background: var(--text-primary);
  border-radius: 50%;
  box-shadow: 0 0 0 4px rgba(250, 250, 250, 0.08);
}
.slider-readout {
  font-family: var(--font-mono);
  color: var(--text-primary);
  text-align: right;
}
.slider-disabled { opacity: 0.45; }

/* ───── SelectPill ───── */
.select-pill {
  appearance: none;
  background: var(--surface-elevated);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-pill);
  padding: 4px 10px 4px 8px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font: inherit;
  font-size: 12px;
  color: var(--text-primary);
  cursor: pointer;
}
.select-pill:hover:not(:disabled) { background: var(--surface-selected); }
.select-pill:disabled { opacity: 0.45; cursor: not-allowed; }
.select-pill-icon { font-size: 13px; line-height: 1; }
.select-pill-chevron { color: var(--text-tertiary); font-size: 9px; }
.select-pill-open .select-pill-chevron { color: var(--text-primary); transform: rotate(180deg); }

/* ───── ColorSwatch ───── */
.color-swatch {
  appearance: none;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 0;
  padding: 0;
  cursor: pointer;
  position: relative;
}
.color-swatch-ring {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.4);
  pointer-events: none;
}
.color-swatch-selected {
  box-shadow: 0 0 0 2px var(--surface-base), 0 0 0 4px var(--text-primary);
}

/* ───── Meter ───── */
.meter { display: inline-flex; gap: 2px; align-items: center; }
.meter-bar {
  display: inline-block;
  width: 3px;
  height: 14px;
  background: var(--secondary);
  border-radius: 1px;
}
.meter-bar-on { background: #4ade80; }
.meter-danger .meter-bar-on { background: var(--action-record); }

/* ───── DisplaySourceCard (UI-07) ───── */
.display-source-card {
  background: var(--surface-elevated);
  border: 2px solid transparent;
  border-radius: var(--radius-panel);
  padding: 10px 12px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  font-family: var(--font-sans);
  width: 360px;
  color: var(--text-primary);
}
.display-source-card-selected { border-color: var(--action-record); }
.display-source-card-unavailable { opacity: 0.6; }
.display-source-header { display: flex; align-items: center; gap: 8px; }
.display-source-label { display: flex; align-items: baseline; gap: 8px; flex: 1; min-width: 0; }
.display-source-name {
  font-size: 13px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.display-source-size {
  font-size: 11px;
  color: var(--text-secondary);
}
.display-source-star { color: var(--kf-marker); font-size: 12px; line-height: 1; }
.display-source-meta {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.display-source-dims {
  background: var(--action-record);
  color: #fff;
  font-family: var(--font-mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--radius-pill);
}
.display-source-chevron { color: var(--text-tertiary); font-size: 11px; transition: transform 120ms; }
.display-source-chevron-open { color: var(--text-primary); transform: rotate(180deg); }

.display-source-unavailable-banner {
  font-size: 11px;
  color: var(--action-record);
  background: rgba(239, 68, 68, 0.10);
  border: 1px solid rgba(239, 68, 68, 0.30);
  border-radius: var(--radius-control);
  padding: 6px 10px;
  text-align: center;
}

/* ───── DisplayPreviewFrame ───── */
.display-preview {
  width: 100%;
  background: linear-gradient(140deg, #2a2a32, #15151a);
  border-radius: var(--radius-control);
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  border: 1px solid var(--line-subtle);
}
.display-preview-titlebar {
  background: #2a2a2f;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 4px 8px;
  height: 16px;
}
.display-preview-tlbtn { width: 8px; height: 8px; border-radius: 50%; }
.display-preview-tlbtn-red { background: #ef4444; }
.display-preview-tlbtn-amber { background: #f59e0b; }
.display-preview-tlbtn-green { background: #10b981; }
.display-preview-body {
  position: relative;
  flex: 1;
  background:
    linear-gradient(135deg, rgba(56, 189, 248, 0.10), rgba(167, 139, 250, 0.10)),
    radial-gradient(closest-side at 50% 60%, #1a1a20, #0b0b0e);
}
.display-preview-chip {
  position: absolute;
  border-radius: 4px;
  display: flex;
  align-items: flex-start;
  padding: 2px 6px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
  color: var(--text-primary);
  font-size: 10px;
}
.display-preview-chip-label {
  font-family: var(--font-sans);
  background: rgba(0, 0, 0, 0.35);
  padding: 1px 4px;
  border-radius: 3px;
  white-space: nowrap;
}
.display-preview-overlay {
  position: absolute;
  top: 6px;
  right: 8px;
  font-family: var(--font-mono);
  font-size: 10px;
  background: rgba(0, 0, 0, 0.55);
  border: 1px solid rgba(250, 250, 250, 0.10);
  border-radius: var(--radius-pill);
  padding: 2px 8px;
  color: var(--text-primary);
}

/* ───── CaptureSourceRow (UI-08) ───── */
.capture-source-row {
  display: grid;
  grid-template-columns: 36px 1fr auto auto auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--surface-elevated);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-panel);
  font-family: var(--font-sans);
  width: 360px;
}
.capture-source-row-expanded { border-color: var(--line-strong); }
.capture-source-row-off { opacity: 0.85; }
.capture-source-leading { display: inline-flex; align-items: center; justify-content: center; }
.capture-source-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.capture-source-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.capture-source-star { color: var(--kf-marker); font-size: 11px; line-height: 1; }
.capture-source-subtitle {
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.capture-source-meter { display: inline-flex; align-items: center; }
.capture-source-toggle { display: inline-flex; align-items: center; }
.capture-source-chevron {
  appearance: none;
  background: transparent;
  border: 0;
  color: var(--text-tertiary);
  font-size: 11px;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-control);
}
.capture-source-chevron:hover { background: var(--surface-selected); color: var(--text-primary); }
.capture-source-chevron-open { color: var(--text-primary); transform: rotate(180deg); }

/* ───── DevicePickerMenu / DevicePickerRow (UI-08) ───── */
.device-picker-row-item { list-style: none; }
.device-picker-row {
  appearance: none;
  border: 0;
  background: transparent;
  width: 100%;
  padding: 8px 10px;
  display: grid;
  grid-template-columns: 36px 1fr auto auto auto;
  align-items: center;
  gap: 10px;
  border-radius: var(--radius-control);
  font: inherit;
  color: var(--text-primary);
  cursor: pointer;
  text-align: left;
  transition: background 120ms ease;
}
.device-picker-row:hover { background: var(--surface-elevated); }
.device-picker-row-selected { background: var(--surface-selected); }
.device-picker-thumb {
  width: 36px;
  height: 24px;
  border-radius: 4px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--text-primary);
  font-size: 11px;
  flex-shrink: 0;
}
.device-picker-thumb-glyph {
  background: rgba(0, 0, 0, 0.35);
  padding: 1px 5px;
  border-radius: 3px;
}
.device-picker-row-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.device-picker-row-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.device-picker-row-detail {
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.device-picker-row-meter { display: inline-flex; align-items: center; }
.device-picker-row-check {
  color: var(--action-record);
  font-weight: 700;
  font-size: 12px;
}

.device-picker-state {
  padding: 24px 20px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.device-picker-state-glyph {
  font-size: 22px;
  color: var(--text-tertiary);
}
.device-picker-state-glyph-warn { color: var(--action-record); }
.device-picker-state-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.device-picker-state-subtitle {
  font-size: 12px;
  color: var(--text-secondary);
  max-width: 240px;
}

.btn-sm { padding: 4px 10px; font-size: 12px; height: 26px; }

/* ───── SystemAudioRow + AppList (UI-09) ───── */
.system-audio-row {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  background: var(--surface-elevated);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-panel);
  width: 360px;
}
.system-audio-leading { display: inline-flex; align-items: center; }
.system-audio-icon-stack { display: inline-flex; align-items: center; }
.system-audio-icon {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  border: 2px solid var(--surface-elevated);
  margin-left: -8px;
  flex-shrink: 0;
}
.system-audio-icon:first-child { margin-left: 0; }
.system-audio-icon-overflow {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  background: var(--secondary);
  color: var(--text-primary);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--surface-elevated);
  margin-left: -8px;
}
.system-audio-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.system-audio-title { font-size: 13px; font-weight: 600; color: var(--text-primary); }
.system-audio-subtitle { font-size: 11px; color: var(--text-secondary); font-family: var(--font-mono); }
.system-audio-toggle { display: inline-flex; align-items: center; }
.system-audio-chevron {
  appearance: none;
  background: transparent;
  border: 0;
  color: var(--text-tertiary);
  font-size: 11px;
  cursor: pointer;
  padding: 4px;
  border-radius: var(--radius-control);
}
.system-audio-chevron-open { color: var(--text-primary); transform: rotate(180deg); }

.system-audio-applist {
  background: var(--surface-popover);
  border: 1px solid var(--line-subtle);
  border-radius: var(--radius-panel);
  padding: 10px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 360px;
}
.system-audio-filters {
  display: inline-flex;
  gap: 4px;
  padding: 3px;
  background: var(--secondary);
  border-radius: var(--radius-pill);
  align-self: flex-start;
}
.system-audio-filter {
  appearance: none;
  border: 0;
  background: transparent;
  font: inherit;
  padding: 3px 12px;
  border-radius: var(--radius-pill);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 11px;
}
.system-audio-filter:hover { color: var(--text-primary); }
.system-audio-filter-active { background: var(--text-primary); color: #09090b; }

.system-audio-rows {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.audio-app-row {
  display: grid;
  grid-template-columns: 18px 24px 1fr auto auto auto;
  align-items: center;
  gap: 10px;
  padding: 6px 8px;
  border-radius: var(--radius-control);
}
.audio-app-row:hover { background: var(--surface-elevated); }
.audio-app-row-selected { background: var(--surface-selected); }

.audio-app-check {
  width: 16px;
  height: 16px;
  border-radius: 4px;
  border: 1px solid var(--line-strong);
  background: var(--surface-base);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: var(--text-primary);
}
.audio-app-check-on {
  background: var(--text-primary);
  color: #09090b;
  border-color: var(--text-primary);
}

.audio-app-icon {
  width: 24px;
  height: 24px;
  border-radius: 5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  flex-shrink: 0;
}

.audio-app-text { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
.audio-app-name {
  font-size: 13px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.audio-app-context {
  font-size: 11px;
  color: var(--text-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.audio-app-live {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--action-record);
}
.audio-app-live-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--action-record);
  box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5);
  animation: rec-pulse 1.4s ease-out infinite;
}
.audio-app-meter { display: inline-flex; align-items: center; }

/* ───── OnScreenOptionsPopover (UI-10) ───── */
.on-screen-options {
  list-style: none;
  padding: 0;
  margin: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.on-screen-option-row {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 6px;
  border-radius: var(--radius-control);
}
.on-screen-option-row:not(:last-child) {
  border-bottom: 1px solid var(--line-subtle);
  border-radius: 0;
  padding-bottom: 12px;
  margin-bottom: 2px;
}
.on-screen-option-row-disabled { opacity: 0.5; }
.on-screen-option-toggle { display: inline-flex; align-items: center; padding-top: 2px; }
.on-screen-option-text {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.on-screen-option-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}
.on-screen-option-description {
  font-size: 12px;
  color: var(--text-secondary);
  line-height: 1.4;
}
