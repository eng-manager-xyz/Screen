<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Audio app row — idle / unselected</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div style="padding:12px;"><div class="system-audio-applist"><div role="toolbar" aria-label="Filter audio apps" class="system-audio-filters"><button data-filter="all" aria-pressed class="system-audio-filter system-audio-filter-active">All</button><button data-filter="none" class="system-audio-filter">None</button><button data-filter="suggested" class="system-audio-filter">Suggested</button><!></div><ul role="listbox" aria-label="Audio apps" class="system-audio-rows"><li role="option" class="audio-app-row"><span aria-hidden="true" class="audio-app-check"> </span><span aria-hidden="true" class="audio-app-icon" style="background:#0ea5e9;">Z</span><span class="audio-app-text"><span class="audio-app-name">Zoom</span><span class="audio-app-context">Idle · last call 12m ago</span></span><!><!><!></li><!></ul></div></div>
  </body>
</html>
