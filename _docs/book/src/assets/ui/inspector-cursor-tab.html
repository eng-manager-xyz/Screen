<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inspector — Cursor tab</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <aside data-tab="cursor" aria-label="Inspector" class="inspector-panel"><div role="tablist" aria-label="Inspector tabs" class="inspector-tabs"><button data-tab="style" class="inspector-tab">Style</button><button data-tab="cursor" aria-pressed class="inspector-tab inspector-tab-active">Cursor</button><button data-tab="audio" class="inspector-tab">Audio</button><button data-tab="captions" class="inspector-tab">Captions</button><button data-tab="ai" class="inspector-tab">AI</button><!></div><div class="inspector-body"><section class="property-section"><span class="property-section-heading">APPEARANCE</span><ul role="list" class="property-section-rows"><li class="property-row"><span class="property-row-label">Size</span><span class="property-row-control"><span role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60" class="property-slider"><span class="property-slider-fill" style="width: 60%;;"></span></span></span><span class="property-row-value">120 %</span></li><li class="property-row"><span class="property-row-label">Color</span><span class="property-row-control"><span class="property-swatches"><button class="property-swatch" style="background: #fafafa;;"></button><button class="property-swatch" style="background: #facc15;;"></button><button aria-pressed class="property-swatch property-swatch-selected" style="background: #38bdf8;;"></button><button class="property-swatch" style="background: #a78bfa;;"></button><button class="property-swatch" style="background: #f97316;;"></button><!></span></span><!></li><li class="property-row"><span class="property-row-label">Halo</span><span class="property-row-control"><span aria-pressed class="property-toggle property-toggle-on"><span class="property-toggle-knob"></span></span></span><!></li><!></ul></section><section class="property-section"><span class="property-section-heading">CLICK EFFECT</span><ul role="list" class="property-section-rows"><li class="property-row"><span class="property-row-label">Effect</span><span class="property-row-control"><button class="property-pill">Ring<!> ▾</button></span><span class="property-row-value">Ring</span></li><!></ul></section><!></div></aside>
  </body>
</html>
