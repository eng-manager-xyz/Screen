<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Timeline — with placeholders</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <section aria-label="Timeline" class="timeline-skeleton"><div role="group" aria-label="Transport" class="timeline-transport"><button aria-label="Play" class="timeline-transport-toggle">▶</button><span class="timeline-timecode">00:03</span><span class="timeline-timecode-sep">/</span><span class="timeline-timecode-total">01:24</span></div><ul role="list" class="timeline-tracks"><li data-id="video" class="timeline-track-row"><span class="timeline-track-label">Video</span><span class="timeline-track-body"><span class="timeline-track-placeholder">drop a clip to fill</span></span></li><li data-id="auto-zoom" class="timeline-track-row"><span class="timeline-track-label">Auto-zoom</span><span class="timeline-track-body"><span class="timeline-track-placeholder">detected from cursor</span></span></li><li data-id="audio" class="timeline-track-row"><span class="timeline-track-label">Audio</span><span class="timeline-track-body"><span class="timeline-track-placeholder">mic + system</span></span></li><!></ul></section>
  </body>
</html>
