<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Recording toolbar — idle (ready)</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div role="toolbar" aria-label="Recording controls" class="recording-toolbar rec-idle"><div class="rec-status"><span class="rec-dot"></span><span class="rec-status-label">Ready</span></div><div class="rec-timer">00:00</div><div class="rec-source"><span class="rec-source-glyph">⌬</span><span class="rec-source-label">Built-in Display</span></div><div class="rec-actions"><button type="button" class="rec-action rec-action-primary"><span class="rec-dot rec-dot-static"></span><span>Start recording</span></button></div></div>
  </body>
</html>
