<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Controls — color swatches</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div class="story-row" style="padding:14px;gap:10px;"><button aria-label="White" aria-pressed title="White" class="color-swatch color-swatch-selected" style="background:#fafafa;"><span class="color-swatch-ring" aria-hidden="true"></span></button><button aria-label="Red" title="Red" class="color-swatch" style="background:#ef4444;"><span class="color-swatch-ring" aria-hidden="true"></span></button><button aria-label="Amber" title="Amber" class="color-swatch" style="background:#f59e0b;"><span class="color-swatch-ring" aria-hidden="true"></span></button><button aria-label="Emerald" title="Emerald" class="color-swatch" style="background:#10b981;"><span class="color-swatch-ring" aria-hidden="true"></span></button><button aria-label="Sky" title="Sky" class="color-swatch" style="background:#38bdf8;"><span class="color-swatch-ring" aria-hidden="true"></span></button><button aria-label="Violet" title="Violet" class="color-swatch" style="background:#a78bfa;"><span class="color-swatch-ring" aria-hidden="true"></span></button><button aria-label="Zinc" title="Zinc" class="color-swatch" style="background:#18181b;"><span class="color-swatch-ring" aria-hidden="true"></span></button></div>
  </body>
</html>
