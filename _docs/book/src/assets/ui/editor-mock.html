<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Editor mock — drop zone result + player + dope sheet</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div class="editor-mock"><div class="card"><div class="card-header"><div class="card-title">Recording 02</div><div class="card-subtitle">Captured 2026-05-09 · 1m 24s</div></div><div class="card-body"><div class="editor-mock-preview"><div class="editor-mock-screen"><div class="editor-mock-screen-label">Player surface</div></div></div><div role="group" aria-label="Player transport" class="player-controls"><button type="button" aria-label="Pause" class="player-toggle player-toggle-playing"><span class="player-toggle-glyph">❚❚</span></button><div data-role="current" class="player-time">0:35</div><div class="player-scrub"><div class="player-scrub-track"><div class="player-scrub-fill" style="width: 42.00%;"></div><div class="player-scrub-handle" style="left: 42.00%;"></div></div></div><div data-role="total" class="player-time">1:24</div></div></div></div><div class="card"><div class="card-header"><div class="card-title">Timeline</div><div class="card-subtitle">4 tracks · 8.0s window</div></div><div class="card-body"><div class="dope-sheet"><div class="dope-row dope-ruler"><div class="dope-label dope-label-spacer"></div><div class="dope-track dope-ruler-track"><div class="dope-tick" style="left: 0.00%;"><span class="dope-tick-label">0s</span></div><div class="dope-tick" style="left: 12.50%;"><span class="dope-tick-label">1s</span></div><div class="dope-tick" style="left: 25.00%;"><span class="dope-tick-label">2s</span></div><div class="dope-tick" style="left: 37.50%;"><span class="dope-tick-label">3s</span></div><div class="dope-tick" style="left: 50.00%;"><span class="dope-tick-label">4s</span></div><div class="dope-tick" style="left: 62.50%;"><span class="dope-tick-label">5s</span></div><div class="dope-tick" style="left: 75.00%;"><span class="dope-tick-label">6s</span></div><div class="dope-tick" style="left: 87.50%;"><span class="dope-tick-label">7s</span></div><div class="dope-tick" style="left: 100.00%;"><span class="dope-tick-label">8s</span></div><!></div></div><div class="dope-row track-video"><div class="dope-label"><span class="dope-label-glyph">▣</span><span class="dope-label-text">Video</span></div><div class="dope-track"><div class="dope-keyframe kf-hold" style="left: 0.00%;"></div><div class="dope-keyframe kf-ease" style="left: 31.25%;"></div><div class="dope-keyframe kf-linear" style="left: 75.00%;"></div><!></div></div><div class="dope-row track-cursor"><div class="dope-label"><span class="dope-label-glyph">↗</span><span class="dope-label-text">Cursor</span></div><div class="dope-track"><div class="dope-keyframe kf-linear" style="left: 15.00%;"></div><div class="dope-keyframe kf-linear" style="left: 56.25%;"></div><!></div></div><div class="dope-row track-audio"><div class="dope-label"><span class="dope-label-glyph">♪</span><span class="dope-label-text">Audio</span></div><div class="dope-track"><div class="dope-keyframe kf-hold" style="left: 0.00%;"></div><div class="dope-keyframe kf-hold" style="left: 50.00%;"></div><div class="dope-keyframe kf-hold" style="left: 93.75%;"></div><!></div></div><div class="dope-row track-caption"><div class="dope-label"><span class="dope-label-glyph">T</span><span class="dope-label-text">Caption</span></div><div class="dope-track"><div class="dope-keyframe kf-marker" style="left: 37.50%;"></div><!></div></div><!><div class="dope-playhead" style="left: 42.50%;"></div></div></div></div></div>
  </body>
</html>
