<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Inspector — Style tab</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>

  <body>
    <aside data-tab="style" aria-label="Inspector" class="inspector-panel"><div role="tablist" aria-label="Inspector tabs" class="inspector-tabs"><button data-tab="style" aria-pressed class="inspector-tab inspector-tab-active">Style</button><button data-tab="cursor" class="inspector-tab">Cursor</button><button data-tab="audio" class="inspector-tab">Audio</button><button data-tab="captions" class="inspector-tab">Captions</button><button data-tab="ai" class="inspector-tab">AI</button><!></div><div class="inspector-body"><section class="property-section"><span class="property-section-heading">APPEARANCE</span><ul role="list" class="property-section-rows"><li class="property-row"><span class="property-row-label">Background</span><span class="property-row-control"><button class="property-pill">Studio dark<!> ▾</button></span><span class="property-row-value">Studio dark</span></li><li class="property-row"><span class="property-row-label">Corner radius</span><span class="property-row-control"><span role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="35" class="property-slider"><span class="property-slider-fill" style="width: 35%;;"></span></span></span><span class="property-row-value">12 px</span></li><li class="property-row"><span class="property-row-label">Drop shadow</span><span class="property-row-control"><span aria-pressed class="property-toggle property-toggle-on"><span class="property-toggle-knob"></span></span></span><!></li><!></ul></section><section class="property-section"><span class="property-section-heading">MOTION</span><ul role="list" class="property-section-rows"><li class="property-row"><span class="property-row-label">Auto-zoom</span><span class="property-row-control"><span role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" class="property-slider"><span class="property-slider-fill" style="width: 50%;;"></span></span></span><span class="property-row-value">2.0×</span></li><li class="property-row"><span class="property-row-label">Smooth pan</span><span class="property-row-control"><span aria-pressed class="property-toggle property-toggle-on"><span class="property-toggle-knob"></span></span></span><!></li><!></ul></section><!></div></aside>
  </body>
</html>
