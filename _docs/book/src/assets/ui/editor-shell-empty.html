<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Editor shell — empty (no clip)</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <section role="main" aria-label="Editor" class="editor-shell"><header class="editor-titlebar editor-titlebar-empty"><span class="editor-titlebar-traffic" aria-hidden="true"><span class="traffic-dot traffic-close"></span><span class="traffic-dot traffic-min"></span><span class="traffic-dot traffic-max"></span></span><span class="editor-titlebar-text"><span class="editor-titlebar-title">No clip loaded</span><!></span></header><div role="toolbar" aria-label="Editor tools" class="editor-toolbar"><div class="editor-toolbar-actions"><button data-id="16-9" aria-pressed class="editor-action editor-action-selected"><span aria-hidden="true" class="editor-action-icon">▭</span><span class="editor-action-label">16:9</span></button><button data-id="crop" class="editor-action"><span aria-hidden="true" class="editor-action-icon">✂</span><span class="editor-action-label">Crop</span></button><button data-id="annotate" disabled class="editor-action editor-action-disabled"><span aria-hidden="true" class="editor-action-icon">✎</span><span class="editor-action-label">Annotate</span></button><button data-id="trim" disabled class="editor-action editor-action-disabled"><span aria-hidden="true" class="editor-action-icon">⎯</span><span class="editor-action-label">Trim</span></button><!></div><div class="editor-toolbar-end"><button disabled class="btn btn-outline btn-sm">Share</button><button disabled class="btn btn-default btn-sm">Export</button></div></div><div class="editor-body"><div class="editor-canvas"><!></div><aside aria-label="Inspector" class="editor-inspector"><!></aside></div><footer class="editor-timeline"><!></footer></section>
  </body>
</html>
