<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Controls — icon buttons</title>
    <link rel="stylesheet" href="./style.css" />
    <style>
      body { padding: 24px; }
    </style>
  </head>
  <body>
    <div class="story-row" style="padding:14px;gap:14px;"><button aria-label="Record" class="icon-btn icon-btn-danger"><span aria-hidden="true">●</span></button><button aria-label="Stop" class="icon-btn icon-btn-filled"><span aria-hidden="true">◼</span></button><button aria-label="Reset" class="icon-btn icon-btn-ghost"><span aria-hidden="true">↻</span></button><button aria-label="Pinned" aria-pressed class="icon-btn icon-btn-ghost icon-btn-pressed"><span aria-hidden="true">✱</span></button><button disabled aria-label="Delete" class="icon-btn icon-btn-ghost"><span aria-hidden="true">⌫</span></button></div>
  </body>
</html>
