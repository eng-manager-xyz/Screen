[book]
authors = ["screen team"]
language = "en"
src = "src"
title = "screen — engineering site"
description = "Architecture, milestones, conventions, per-feature stories with screenshots, plus the rustdoc API reference under /api."

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
no-section-label = false
mathjax-support = false
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[preprocessor.links]

[preprocessor.mermaid]
command = "mdbook-mermaid"
