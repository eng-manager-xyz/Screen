[book]
authors = ["screen team"]
language = "en"
multilingual = false
src = "src"
title = "screen — engineering site"
description = "Architecture, milestones, conventions, per-feature stories with screenshots, plus the rustdoc API reference under /api."

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = ""
edit-url-template = ""
no-section-label = false
mathjax-support = false
copy-fonts = true
additional-css = ["theme/zinc.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[preprocessor.links]
