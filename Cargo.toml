[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
wisp = { path = "crates/wisp", version = "0.1.0" }
glam = "0.29"
wgpu = "24"
pollster = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "warn"
unused_imports = "warn"
# Documentation gate. `warn` (not `deny`) so the cascade can be backfilled
# crate-by-crate without blocking unrelated work; `just docs-strict` flips it
# to deny via RUSTDOCFLAGS for the full check.
missing_docs = "warn"

[workspace.lints.rustdoc]
# Broken intra-doc links + private intra-doc links are real bugs.
broken_intra_doc_links = "warn"
private_intra_doc_links = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
