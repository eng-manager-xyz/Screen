# Docs site → GitHub Pages.
#
# Builds the mdBook prose site + the rustdoc API reference and publishes
# them to Pages. On pushes to `main` the build is also deployed; on PRs
# it runs as a build-only check (no deploy).
#
# Output structure (mirrors `just site` locally):
#   target/book/                ← mdBook prose
#   target/book/api/<crate>/    ← rustdoc per crate
#
# Pages source: GitHub-hosted artifact (the official actions/upload-pages-artifact
# pattern). No `gh-pages` branch needed — pure artifact-based deploy.

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping queued runs in between.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  MDBOOK_VERSION: "0.4.40"
  MDBOOK_MERMAID_VERSION: "0.17.0"
  # Note: do NOT set `RUSTFLAGS: -D warnings` globally — it promotes
  # transitive-crate future-incompat warnings (e.g. `block v0.1.6`,
  # `proc-macro-error2`) into hard failures. Use `RUSTDOCFLAGS` only,
  # scoped to the strict-docs path (`just docs-strict`).

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust nightly per `rust-toolchain.toml` is auto-installed by rustup
      # on first cargo invocation; we just install rustup itself.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      # `cargo doc --workspace` compiles every crate, including screen-app
      # which transitively pulls Tauri 2's gtk-rs / glib / webkit2gtk
      # toolchain. Without these dev headers `glib-sys`'s build script
      # aborts at pkg-config.
      - name: Install Linux build deps (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Install mdBook + mdbook-mermaid
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Sanity-check both binaries — early failure is easier to debug
          # than a confusing "preprocessor 'mermaid' returned exit 127" later.
          "$HOME/.local/bin/mdbook" --version
          "$HOME/.local/bin/mdbook-mermaid" --version

      # cargo doc needs `missing_docs` to stay a warn-level lint (already
      # the case in workspace lints) so this won't fail on a clean tree.
      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items

      - name: mdBook build
        run: |
          mkdir -p target/book
          mdbook build _docs/book --dest-dir "$PWD/target/book"

      - name: Splice rustdoc into the book under /api
        run: |
          rm -rf target/book/api
          cp -r target/doc target/book/api

      - name: Add a fallback index for /api
        run: |
          # The rustdoc folder doesn't have a single index.html at its root;
          # wire one that bounces to the workspace crate listing.
          if [ ! -f target/book/api/index.html ]; then
            cat > target/book/api/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=./screen_app/" />
          HTML
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

      # On PRs we just want the build to pass — no deploy.
      - name: Build summary
        run: |
          echo "::notice::mdBook + rustdoc built successfully."
          echo "::notice::Prose pages under target/book/, rustdoc under target/book/api/."

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
