# Docs site → GitHub Pages.
#
# Builds three mdBooks + the rustdoc API reference + the WebGPU
# demo (M-CHART.0 / AUT-180) and publishes them as a single Pages
# artifact. Path-based routing (no custom domain):
#
#   /Screen/                ← screen project book (mdBook)
#   /Screen/wisp/           ← wisp library book (mdBook)
#   /Screen/wisp-chart/     ← wisp-chart book (mdBook)
#   /Screen/wisp-chart/demo/← WebGPU demo (Trunk-built wasm)
#   /Screen/api/            ← rustdoc index (every workspace crate)
#
# Books are composed under `target/book/{wisp,wisp-chart}/` so the
# resulting directory tree maps 1:1 to the deployed URL space.
# All three books run through the in-repo `mdbook-preprocessor-cross`
# so `{{wisp-link …}}`, `{{wisp-chart-link …}}`, and `{{shared …}}`
# tags resolve correctly per book.
#
# On `push: main` the build is also deployed; on PRs it runs as a
# build-only check (no deploy). The `concurrency` group serializes
# Pages deploys so two `main` pushes don't race.

name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Bash everywhere for consistency with gate.yml. docs.yml runs on
# ubuntu-latest only today, but the explicit default keeps both
# workflows on the same shell discipline so a future Windows /
# macOS expansion doesn't trip on PowerShell parsing.
defaults:
  run:
    shell: bash

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Pinned quartet — see `_docs/QA.md` for the rationale. mdbook 0.5.x
  # reshapes the preprocessor JSON in ways admonish 1.20 doesn't
  # accept; 0.4.52 is the verified-green combo.
  MDBOOK_VERSION: "0.4.52"
  MDBOOK_MERMAID_VERSION: "0.15.0"
  MDBOOK_ADMONISH_VERSION: "1.20.0"
  MDBOOK_CMDRUN_VERSION: "0.7.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (with wasm32 target for the WebGPU demo)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
          targets: wasm32-unknown-unknown

      # `cargo doc --workspace` compiles every crate, including
      # screen-app which transitively pulls Tauri 2's gtk-rs / glib /
      # webkit2gtk toolchain. Without these dev headers `glib-sys`'s
      # build script aborts at pkg-config.
      - name: Install Linux build deps (Tauri 2)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-docs-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-docs-

      - name: Install mdBook + preprocessors (prebuilt)
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/badboy/mdbook-mermaid/releases/download/v${MDBOOK_MERMAID_VERSION}/mdbook-mermaid-v${MDBOOK_MERMAID_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          curl -sSL "https://github.com/tommilligan/mdbook-admonish/releases/download/v${MDBOOK_ADMONISH_VERSION}/mdbook-admonish-v${MDBOOK_ADMONISH_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install mdbook-cmdrun (from crates.io)
        run: cargo install --locked mdbook-cmdrun --version "${MDBOOK_CMDRUN_VERSION}"

      # In-repo preprocessor (DOCS-00). Built first so both `mdbook
      # build` invocations below can find it on PATH.
      - name: Build mdbook-preprocessor-cross
        run: |
          cargo build -p mdbook-preprocessor-cross
          echo "$PWD/target/debug" >> "$GITHUB_PATH"

      - name: Sanity-check preprocessor binaries
        run: |
          mdbook --version
          mdbook-mermaid --version
          mdbook-admonish --version
          mdbook-cmdrun --help >/dev/null
          mdbook-preprocessor-cross supports html

      - name: cargo doc
        run: cargo doc --workspace --no-deps --document-private-items

      - name: Install just
        uses: extractions/setup-just@v2

      # `just site-check` runs everything we need: builds BOTH books,
      # then greps rendered HTML for `mdbook-preprocessor-cross.*error`
      # sentinels (the runtime drift gate that the source-level
      # `shared-check` in `just gate` can't catch). Driving from `just`
      # keeps the local + CI behaviour identical — a contributor who
      # runs `just site-check` locally sees the same pass/fail as CI.
      - name: just site-check (mdbook build all three books + drift gate)
        run: just site-check

      # M-CHART.0 / AUT-180 — Trunk-bundle the wisp-chart-web demo
      # into the Pages artefact at `/Screen/wisp-chart/demo/`.
      # `--public-url` tells Trunk to emit relative asset references
      # that resolve under that subpath.
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build wisp-chart-web demo (Trunk → /Screen/wisp-chart/demo/)
        run: |
          mkdir -p target/book/wisp-chart/demo
          cd crates/wisp-chart-web
          trunk build --release \
            --public-url /Screen/wisp-chart/demo/ \
            --dist "$GITHUB_WORKSPACE/target/book/wisp-chart/demo"

      - name: Splice rustdoc into the book under /api
        run: |
          rm -rf target/book/api
          cp -r target/doc target/book/api

      - name: Add a fallback index for /api
        run: |
          # The rustdoc folder doesn't have a single index.html at its root;
          # wire one that bounces to the workspace crate listing.
          if [ ! -f target/book/api/index.html ]; then
            cat > target/book/api/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=./screen_app/" />
          HTML
          fi

      - name: Verify all three books + demo mounted at expected paths
        run: |
          test -f target/book/index.html         || (echo "missing screen book root";  exit 1)
          test -f target/book/wisp/index.html    || (echo "missing wisp book root";    exit 1)
          test -f target/book/wisp-chart/index.html \
                                                 || (echo "missing wisp-chart book root"; exit 1)
          test -d target/book/api                || (echo "missing rustdoc tree";      exit 1)
          # The wisp book references must resolve to actual files
          # post-deploy. Smoke-test a couple of well-known paths.
          test -f target/book/wisp/wisp/overview.html        || (echo "missing wisp overview"; exit 1)
          test -f target/book/wisp/wisp/chunks/filter-blur.html \
                                                             || (echo "missing wisp filter-blur"; exit 1)
          test -f target/book/wisp-overview.html             || (echo "missing screen-side wisp summary"; exit 1)
          # wisp-chart book + WebGPU demo smoke tests.
          test -f target/book/wisp-chart/charts/gantt/api.html \
                                                             || (echo "missing wisp-chart gantt api"; exit 1)
          test -f target/book/wisp-chart/web-demo.html       || (echo "missing wisp-chart web-demo chapter"; exit 1)
          test -f target/book/wisp-chart/demo/index.html     || (echo "missing WebGPU demo index"; exit 1)
          test -n "$(ls target/book/wisp-chart/demo/*.wasm 2>/dev/null)" \
                                                             || (echo "missing WebGPU demo .wasm"; exit 1)
          test -n "$(ls target/book/wisp-chart/demo/*.js 2>/dev/null)" \
                                                             || (echo "missing WebGPU demo wasm-bindgen glue JS"; exit 1)

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/book

      - name: Build summary
        run: |
          {
            echo "## docs build"
            echo ""
            echo "- screen book:      \`target/book/index.html\`"
            echo "- wisp book:        \`target/book/wisp/index.html\`"
            echo "- wisp-chart book:  \`target/book/wisp-chart/index.html\`"
            echo "- WebGPU demo:      \`target/book/wisp-chart/demo/index.html\`"
            echo "- rustdoc:          \`target/book/api/\`"
            echo ""
            echo "Three books + WebGPU demo composed into one Pages artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
