# Path-filtered gate (DOCS-04 + DOCS-07).
#
# # Why path-filtered
#
# A change to wisp doesn't always touch screen-app, and vice versa.
# Running the full cross-platform gate on every push burns ~20min
# of CI time even when the PR only edits a wisp filter shader. The
# `dorny/paths-filter@v3` action lets us route the change through
# the right gate:
#
# - **gate-wisp** — renderer + preprocessor. Triggered when only
#   `crates/wisp/**`, `crates/wisp-storybook/**`, `_docs/wisp-book/**`,
#   `_docs/shared/**`, or `tools/mdbook-preprocessor-cross/**`
#   change. ~5 min on each runner. Runs the wisp-subset of
#   `cargo nextest` + clippy on macOS, Ubuntu, and Windows.
#
# - **gate-screen** — full integration. Triggered on any other
#   crate, any Tauri/Leptos change, any workspace-wide file
#   (`Cargo.lock`, `Cargo.toml`, `rust-toolchain.toml`, `Justfile`,
#   `deny.toml`), and any `.github/workflows/` edit. Runs the full
#   `just gate` on macOS, Ubuntu, and Windows.
#
# - **gate-all** — synthetic required check. Aggregates the
#   conditional jobs so branch-protection rules can stay green
#   when a job legitimately skips. Required for merge.
#
# # Platform matrix
#
# All gates run on a `[macos-latest, ubuntu-latest, windows-latest]`
# matrix with `fail-fast: false` so one platform's failure doesn't
# cancel the others:
#
# - **macos-latest** — truth runner for wgpu (real Apple Silicon
#   Metal). Every wgpu test passes without skips. Brew installs
#   GStreamer for the screen gate.
#
# - **ubuntu-latest** — validates the Linux build path (gtk-rs +
#   winit x11/wayland + GStreamer apt). Lavapipe (software Vulkan)
#   loses the device on multi-bind-group filter pipelines, so the
#   3 affected tests skip via `WISP_SKIP_GPU_FILTER_TESTS=1`.
#
# - **windows-latest** — validates the Windows build path
#   (MSVC, WebView2, native DX12 for wgpu). GStreamer is NOT
#   installed in CI (choco-install takes ~5 min and the
#   `gstreamer_available()` runtime guard skips those tests
#   cleanly when the binary is absent). `just` works via Git Bash
#   (preinstalled on windows-latest); recipes with
#   `#!/usr/bin/env bash` shebangs route through Git Bash
#   automatically. No `WGPU_BACKEND` / `WISP_SKIP_GPU_FILTER_TESTS`
#   env vars — those are lavapipe-specific.
#
# # `just gate` is mdbook-free
#
# The previous iteration of this workflow failed because
# `just gate` → `shared-check` → `site` → `mdbook build` required
# `mdbook` on PATH. We split that: `gate` runs the source-level
# `shared-check` (Python only); `site-check` (which builds both
# books and greps rendered HTML) is invoked from `docs.yml`
# instead. The gate stays Rust-only — easier to install on every
# runner.

name: gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default every `run:` step to bash on every OS — including windows-latest,
# where bash routes through Git Bash (preinstalled on the runner image).
# Without this, windows-latest uses PowerShell by default and bash-style
# line continuations (`\` at end-of-line) crash with
#   "Missing expression after unary operator '--'"
# because PowerShell ends the statement at the newline and parses the next
# line's `--all-targets` as a unary minus. Setting `shell: bash` once at
# workflow level removes the entire class of `\`-continuation gotchas.
defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: detect changed paths
    runs-on: ubuntu-latest
    outputs:
      wisp: ${{ steps.filter.outputs.wisp }}
      screen: ${{ steps.filter.outputs.screen }}
      wisp_chart: ${{ steps.filter.outputs.wisp_chart }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # `_docs/shared/` and the workspace-wide files
          # (`Cargo.lock` etc.) appear under MULTIPLE filters so a
          # change there triggers every relevant gate — wisp because
          # shared content might break it, screen because workspace-
          # level changes affect everyone, wisp-chart because it
          # depends on wisp.
          filters: |
            wisp:
              - 'crates/wisp/**'
              - 'crates/wisp-storybook/**'
              - '_docs/wisp-book/**'
              - '_docs/shared/**'
              - 'tools/mdbook-preprocessor-cross/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/gate.yml'
            screen:
              - 'crates/app/**'
              - 'crates/app-ui/**'
              - 'crates/app-e2e/**'
              - 'crates/decode/**'
              - 'crates/media/**'
              - 'crates/playback/**'
              - 'crates/preview/**'
              - 'crates/ui-storybook/**'
              - 'crates/dev-server/**'
              - '_docs/book/**'
              - '_docs/shared/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - 'Justfile'
              - 'deny.toml'
              - 'rustfmt.toml'
              - '.github/workflows/gate.yml'
            wisp_chart:
              - 'crates/wisp-chart/**'
              - 'crates/wisp-chart-web/**'
              - 'crates/wisp/**'
              - '_docs/wisp-chart-book/**'
              - '_docs/shared/**'
              - 'tools/mdbook-preprocessor-cross/**'
              - 'Cargo.lock'
              - 'Cargo.toml'
              - 'rust-toolchain.toml'
              - '.github/workflows/gate.yml'

  gate-wisp:
    name: gate-wisp (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.wisp == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-gate-wisp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-wisp-

      # Linux-only: lavapipe + X11/wayland headers for headless wgpu.
      # macOS uses native Metal (no install). Windows uses native DX12
      # (no install; lavapipe is software Vulkan, not relevant).
      - name: Install Linux deps (lavapipe for wgpu headless)
        if: matrix.os == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers \
            libvulkan1 \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      # Lavapipe-only — the 3 multi-bind-group filter tests run
      # natively on macOS Metal and Windows DX12.
      - name: Configure wgpu for Linux headless CI
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "WGPU_BACKEND=vulkan"
            echo "WGPU_POWER_PREF=low"
            echo "WISP_SKIP_GPU_FILTER_TESTS=1"
          } >> "$GITHUB_ENV"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # The wisp subset: fmt + clippy + tests for wisp, the wisp
      # storybook, and the cross-book preprocessor. No Tauri, no
      # GStreamer, no Leptos — faster wheels-up.
      - name: cargo fmt (wisp subset)
        run: cargo fmt -p screen-wisp -p wisp-storybook -p mdbook-preprocessor-cross -- --check

      - name: cargo clippy (wisp subset)
        run: |
          cargo clippy \
            -p screen-wisp \
            -p wisp-storybook \
            -p mdbook-preprocessor-cross \
            --all-targets --all-features \
            -- -D warnings

      - name: cargo nextest (wisp subset)
        run: |
          cargo nextest run \
            -p screen-wisp \
            -p wisp-storybook \
            -p mdbook-preprocessor-cross \
            --all-features

      - name: cargo doctest (wisp subset)
        run: |
          cargo test --doc \
            -p screen-wisp \
            -p wisp-storybook \
            -p mdbook-preprocessor-cross

  # M-CHART.0 / AUT-180 — wisp-chart + its WebGPU demo crate.
  #
  # Tiers:
  # - **Tier A (required):** `cargo check --target wasm32-unknown-unknown`
  #   on wisp-chart + wisp-chart-web. Proves the wasm path compiles.
  # - **Tier B (required):** `trunk build --release` of the demo.
  #   Proves the bundled artefact (HTML + .wasm + glue JS) exists.
  # - **Tier C (optional, signal-only):** Runtime WebGPU verification
  #   in headless Chrome with SwiftShader. Marked `continue-on-error`
  #   so flakes in the GPU stack don't block PRs while we stabilize
  #   the configuration. Lands in a follow-on PR.
  gate-wisp-chart:
    name: gate-wisp-chart (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.wisp_chart == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly per rust-toolchain.toml) with wasm32 target
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-gate-wisp-chart-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-wisp-chart-

      # Linux: wisp depends transitively on winit's x11/wayland
      # headers for the (dev-only) Application surface. Even though
      # we're only checking wisp-chart + wisp-chart-web, cargo's
      # workspace resolution may pull winit. Install just the
      # x11/wayland devel headers — full Tauri toolchain isn't
      # needed here.
      - name: Install Linux deps (winit headers, no Tauri toolchain)
        if: matrix.os == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            mesa-vulkan-drivers \
            libvulkan1

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Trunk — the WASM bundler. Pre-built binary install keeps CI
      # under a minute for this step.
      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: cargo fmt (wisp-chart subset)
        run: cargo fmt -p wisp-chart -p wisp-chart-web -- --check

      - name: cargo clippy (native target)
        run: |
          cargo clippy \
            -p wisp-chart \
            -p wisp-chart-web \
            --all-targets --all-features \
            -- -D warnings

      - name: cargo clippy (wasm32 target)
        run: |
          cargo clippy \
            --target wasm32-unknown-unknown \
            -p wisp-chart \
            -p wisp-chart-web \
            -- -D warnings

      - name: cargo nextest (wisp-chart unit tests, native)
        run: cargo nextest run -p wisp-chart

      - name: cargo doctest (wisp-chart)
        run: cargo test --doc -p wisp-chart

      # Tier A: wasm32 compile.
      - name: cargo check --target wasm32-unknown-unknown
        run: |
          cargo check --target wasm32-unknown-unknown \
            -p wisp-chart \
            -p wisp-chart-web

      # Tier B: full Trunk bundle.
      - name: trunk build --release
        run: |
          cd crates/wisp-chart-web
          trunk build --release \
            --public-url /Screen/wisp-chart/demo/ \
            --dist "$GITHUB_WORKSPACE/target/wisp-chart-demo-dist"

      - name: Verify Trunk artefact
        run: |
          test -f target/wisp-chart-demo-dist/index.html \
            || (echo "::error::Trunk did not produce index.html"; exit 1)
          test -n "$(ls target/wisp-chart-demo-dist/*.wasm 2>/dev/null)" \
            || (echo "::error::Trunk did not produce a .wasm file"; exit 1)
          test -n "$(ls target/wisp-chart-demo-dist/*.js 2>/dev/null)" \
            || (echo "::error::Trunk did not produce wasm-bindgen glue JS"; exit 1)
          ls -la target/wisp-chart-demo-dist/

  gate-screen:
    name: gate-screen (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.screen == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (nightly per rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-gate-screen-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-gate-screen-

      - name: Install macOS deps (GStreamer)
        if: matrix.os == 'macos-latest'
        run: brew install gstreamer

      - name: Install Linux deps (Tauri 2 + GStreamer + lavapipe + winit)
        if: matrix.os == 'ubuntu-latest'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            gstreamer1.0-tools \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-libav \
            mesa-vulkan-drivers \
            libvulkan1 \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev

      # Windows: WebView2 (Tauri 2) + MSVC build tools are preinstalled
      # on windows-latest. GStreamer is intentionally NOT installed —
      # the `gstreamer_available()` runtime guard in `decode`,
      # `preview`, and `screen-app` integration tests skips them
      # cleanly when the binary is absent. Saves ~5 min of CI per run.

      # Lavapipe-only.
      - name: Configure wgpu for Linux headless CI
        if: matrix.os == 'ubuntu-latest'
        run: |
          {
            echo "WGPU_BACKEND=vulkan"
            echo "WGPU_POWER_PREF=low"
            echo "WISP_SKIP_GPU_FILTER_TESTS=1"
          } >> "$GITHUB_ENV"

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # Smoke-check that `bash` is available before running `just gate`.
      # On windows-latest, Git Bash is preinstalled and on PATH as
      # `bash.exe`; recipes with `#!/usr/bin/env bash` shebangs use it.
      # If a runner image change ever drops Git Bash, this fails fast
      # with a clear error instead of an opaque recipe failure.
      - name: Sanity-check bash for `just` recipes
        run: bash --version

      # Anti-regression: `just gate` is Rust + python only. If a future
      # change wires `gate` to need `mdbook` (or any preprocessor) on
      # PATH, this assertion fires BEFORE the gate runs and points at
      # the right fix (move the dep to `site-check` in docs.yml).
      # Burned cycle history: DOCS-02 → AUT-156 wired shared-check to
      # `site`, gate failed with `mdbook: command not found`. This
      # step turns that failure mode into a clear error message.
      - name: Anti-regression — gate must not need mdbook
        shell: bash
        run: |
          if command -v mdbook >/dev/null 2>&1; then
            echo "::error::mdbook is on PATH in gate-screen runner."
            echo "::error::This means a previous step installed it, OR the gate now needs it."
            echo "::error::Site-rendering belongs in docs.yml via just site-check, not in just gate."
            echo "::error::See CLAUDE.md § 'GitHub Actions' → 'just gate must stay mdbook-free'."
            exit 1
          fi
          echo "OK: mdbook is not on PATH; gate is Rust + python only."

      - name: just gate
        run: just gate

      # ─── Tier-2 e2e (local only) ────────────────────────────────────────
      # `just e2e` is intentionally NOT run in CI. tauri-driver +
      # WebKitGTK under xvfb proved flaky enough on GitHub-hosted Ubuntu
      # runners that the signal stopped being useful. Contributors run
      # it locally before opening a PR that touches the Tauri shell —
      # see `_docs/book/src/app-ui/testing.md`.

  # Synthetic required check. Branch protection should require this
  # job. It passes iff every triggered gate passed (skipped jobs
  # don't fail). Without this, branch-protection rules that require
  # `gate-wisp` would block screen-only PRs (and vice versa) because
  # the conditional job would be skipped rather than passing.
  gate-all:
    name: gate-all
    needs: [changes, gate-wisp, gate-screen, gate-wisp-chart]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs succeeded
        run: |
          fail=0
          if [[ "${{ needs.changes.outputs.wisp }}" == "true" \
                && "${{ needs.gate-wisp.result }}" != "success" ]]; then
            echo "::error::gate-wisp was required but result was ${{ needs.gate-wisp.result }}"
            fail=1
          fi
          if [[ "${{ needs.changes.outputs.screen }}" == "true" \
                && "${{ needs.gate-screen.result }}" != "success" ]]; then
            echo "::error::gate-screen was required but result was ${{ needs.gate-screen.result }}"
            fail=1
          fi
          if [[ "${{ needs.changes.outputs.wisp_chart }}" == "true" \
                && "${{ needs.gate-wisp-chart.result }}" != "success" ]]; then
            echo "::error::gate-wisp-chart was required but result was ${{ needs.gate-wisp-chart.result }}"
            fail=1
          fi
          if [[ "${{ needs.changes.outputs.wisp }}" != "true" \
                && "${{ needs.changes.outputs.screen }}" != "true" \
                && "${{ needs.changes.outputs.wisp_chart }}" != "true" ]]; then
            echo "::notice::no relevant paths changed — gate-all passes by default"
          fi
          exit $fail
