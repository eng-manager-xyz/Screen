[package]
name = "wisp-chart"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Opinionated chart compositions (Gantt v1) rendered by `wisp`. Data structs in, scene-graph subtree out. Native + WebGPU/wasm."

[lints]
workspace = true

# `wisp-chart` compiles for both native and wasm32-unknown-unknown.
# It depends on `wisp` (also wasm-clean — `winit` lives in wisp's
# [dev-dependencies] only) and on `jiff` for date handling.
#
# The chart-specific deps stay scoped HERE — never added to `wisp`,
# per AUT-180:
#   "wisp-chart adds all chart-specific dependencies (jiff, palette
#    types, contrast utils) to its OWN Cargo.toml. wisp continues to
#    know nothing about dates, themes, charts, or palettes — it stays
#    a Pixi-equivalent primitive renderer."
[dependencies]
wisp.workspace = true
# wisp-animation supplies the `Decay` primitive used by Gantt's
# kinetic-pan (WG.7 / AUT-327). The dep is added here (not in the
# workspace's wisp-chart-web) because the math is small + pure,
# and downstream chart-web/native consumers reuse it unchanged.
wisp-animation = { path = "../wisp-animation" }
glam.workspace = true
# jiff is scoped to wisp-chart; not added to workspace dependencies
# so it cannot leak into wisp. Re-pin in this file when bumping.
jiff = { version = "0.2", default-features = false, features = ["std"] }

[dev-dependencies]
# Snapshot testing for the chart layout's deterministic outputs
# (date→x, row→y, divider detection).
insta = { version = "1", features = ["yaml", "redactions"] }
# Axis / legend tests need a wgpu device to build a bitmap font
# atlas; `pollster::block_on` drives the async `Application::new`
# from inside a `#[test]` fn.
pollster = "0.4"
# `chart_text` unit tests need `wgpu::TextureFormat` to construct a
# `TextTexturePipeline`. Kept dev-only so wisp-chart's runtime API
# stays wgpu-free — every wgpu type the chart code touches comes
# from `wisp::*` re-exports.
wgpu = "24"
