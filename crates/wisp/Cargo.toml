[package]
# Published to crates.io as `screen-wisp` because the bare name
# `wisp` is already claimed by an unrelated project (a tmux
# workspace navigator). Internal code keeps `use wisp::...` via
# the workspace-dep alias (`wisp = { package = "screen-wisp", ... }`
# in the root `Cargo.toml`'s `[workspace.dependencies]`) so calls
# inside the monorepo never have to change.
#
# Downstream crates.io consumers either:
#  - call `use screen_wisp::...` directly, OR
#  - alias on their dep line:
#      `wisp = { package = "screen-wisp", version = "0.1" }`
#    and then `use wisp::...`.
name = "screen-wisp"
version.workspace = true
edition.workspace = true
license.workspace = true
# Override the workspace default (`publish = false`) — wisp is the
# only crate in this workspace published to crates.io. Releases are
# driven by `release-plz` (see `.github/workflows/release-plz.yml`);
# do NOT run `cargo publish -p screen-wisp` by hand on main.
publish = true
description = "Pixi-shaped 2D scene graph + filter chain + mask system + text rendering on wgpu. Native Rust, no JS, no DOM. Used by the Screen Studio-style recorder."
repository = "https://github.com/eng-manager-xyz/Screen"
homepage = "https://eng-manager-xyz.github.io/Screen/wisp/"
documentation = "https://docs.rs/wisp"
readme = "README.md"
keywords = ["wgpu", "graphics", "2d", "scene-graph", "renderer"]
categories = ["graphics", "rendering", "rendering::graphics-api"]
# Bundle the LICENSE alongside the crate so crates.io / docs.rs show
# it inline and downstream consumers don't have to navigate to the
# monorepo. cargo publish includes the workspace root LICENSE only if
# we explicitly list it via `include`; the more idiomatic path is a
# crate-local copy.
include = [
    "/src/**/*.rs",
    "/src/**/*.wgsl",
    "/shaders/**/*.wgsl",
    "/examples/**/*.rs",
    "/tests/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[lints]
workspace = true

# Decouple the LIBRARY name from the PACKAGE name. The package
# `screen-wisp` is what crates.io / `cargo -p screen-wisp` see;
# the library `wisp` is what Rust code sees in `use wisp::...`.
# This lets internal examples + external consumers both write
# idiomatic `use wisp::...` regardless of the crates.io collision
# that forced the `screen-wisp` package rename.
#
# Downstream Cargo.toml form:
#     screen-wisp = "0.1"
# and then in the .rs file:
#     use wisp::prelude::*;
[lib]
name = "wisp"
path = "src/lib.rs"

[dependencies]
wgpu = "24"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slotmap = "1"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
# Cosmic Text — layout backend for `FlexibleText` (M-TEXT.2 / AUT-76).
# `default-features = false` skips the swash shaper bundle so we can ship
# without bundled fonts; we add `std` + `swash` for FontSystem support.
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
# Glyphon — wgpu-side rasterizer for cosmic-text layouts (M-TEXT.3 / AUT-77).
# Pinned to 0.8 to match wgpu 24 + cosmic-text 0.12.
glyphon = "=0.8.0"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
pollster = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# winit's default features include `x11` + `wayland` on Linux; one of our
# transitive deps appears to pull winit with `default-features = false`,
# which leaves no `target_os = "linux"` branch active and trips winit's
# `compile_error!`. Re-enable the Linux backends explicitly so the
# union-unified feature set has at least one Linux backend.
winit = { version = "0.30", features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
# Testing spine — see _docs/TESTING.md
rstest = "0.25"
insta = { version = "1", features = ["json", "yaml", "redactions"] }
proptest = "1"
# Decode crate — consumed by the `playback_demo` example to prove the
# decode → VideoTexture → render path end-to-end.
decode = { path = "../decode" }
