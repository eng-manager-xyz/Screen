[package]
name = "wisp"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "2D scene graph + filter chain on wgpu, Pixi-shaped."

[lints]
workspace = true

[dependencies]
wgpu = "24"
glam = "0.29"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
slotmap = "1"
font8x8 = { version = "0.3", default-features = false, features = ["unicode"] }
# Cosmic Text — layout backend for `FlexibleText` (M-TEXT.2 / AUT-76).
# `default-features = false` skips the swash shaper bundle so we can ship
# without bundled fonts; we add `std` + `swash` for FontSystem support.
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
# Glyphon — wgpu-side rasterizer for cosmic-text layouts (M-TEXT.3 / AUT-77).
# Pinned to 0.8 to match wgpu 24 + cosmic-text 0.12.
glyphon = "=0.8.0"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
pollster = "0.4"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# winit's default features include `x11` + `wayland` on Linux; one of our
# transitive deps appears to pull winit with `default-features = false`,
# which leaves no `target_os = "linux"` branch active and trips winit's
# `compile_error!`. Re-enable the Linux backends explicitly so the
# union-unified feature set has at least one Linux backend.
winit = { version = "0.30", features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
# Testing spine — see _docs/TESTING.md
rstest = "0.25"
insta = { version = "1", features = ["json", "yaml", "redactions"] }
proptest = "1"
# Decode crate — consumed by the `playback_demo` example to prove the
# decode → VideoTexture → render path end-to-end.
decode = { path = "../decode" }
