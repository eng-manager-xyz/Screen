[package]
name = "screen-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Screen recorder Tauri shell."

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enables Tauri's `custom-protocol` feature, which flips `cfg(dev)` off
# in `tauri`'s build.rs and makes the webview load the bundled
# `frontendDist` (`crates/app-ui/dist/`) instead of trying to reach the
# `devUrl` (`http://localhost:1420`). Without this feature, every
# `cargo run -p screen-app` launches a webview pointed at a dev server
# that isn't running — symptom is a blank window logging "Failed to
# load resource: Could not connect to the server localhost:1420". The
# `cargo tauri dev` CLI enables this automatically alongside spawning
# `trunk serve`; for the plain `cargo run` path used by
# `just test-recorder`, we have to forward it ourselves.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
playback = { path = "../playback" }
decode = { path = "../decode" }
media = { path = "../media" }
wisp = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
pollster = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `test` feature enables `tauri::test::mock_builder` etc. for the IPC
# harness in `tests/commands.rs`. Note: cargo unifies dep + dev-dep
# features, so the release binary also gets the test module compiled in
# (a known cargo wart). The footprint is small enough to accept.
tauri = { version = "2", features = ["test", "protocol-asset"] }
serde_json = "1"

[package.metadata.cargo-machete]
# `tauri::generate_context!()` uses the dep at macro-expansion time;
# machete's static analysis doesn't see that.
ignored = ["tauri"]
