[package]
name = "screen-app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Screen recorder Tauri shell."

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Enables Tauri's `custom-protocol` feature, which flips `cfg(dev)` off
# in `tauri`'s build.rs and makes the webview load the bundled
# `frontendDist` (`crates/app-ui/dist/`) instead of trying to reach the
# `devUrl` (`http://localhost:1420`). Without this feature, every
# `cargo run -p screen-app` launches a webview pointed at a dev server
# that isn't running — symptom is a blank window logging "Failed to
# load resource: Could not connect to the server localhost:1420". The
# `cargo tauri dev` CLI enables this automatically alongside spawning
# `trunk serve`; for the plain `cargo run` path used by
# `just test-recorder`, we have to forward it ourselves.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "macos-private-api"] }
playback = { path = "../playback" }
decode = { path = "../decode" }
media = { path = "../media" }
wisp = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# M-CAM.3 diagnostic — encode the first received frame to PNG so the
# user has visual proof BGRA pixels reached Rust. PNG-only build of
# `image` keeps the dep surface minimal (no JPEG/WebP/etc decoders).
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# M-SAVE.0 — native folder picker for the user-chosen output
# directory. Part of the Tauri 2 plugin family; we use the Rust-side
# `DialogExt` API from inside our own `pick_output_dir` command rather
# than the JS guest bindings, so no extra capability grant is needed
# (the webview only ever invokes our command, never `plugin:dialog|*`).
tauri-plugin-dialog = "2"
# M-SAVE.0 — recorder-settings persistence (output dir + last-used
# format) as JSON at `<app-config-dir>/recorder-settings.json`. Was
# dev-only before; the settings module needs it at runtime now.
serde_json = "1"

# M-RECP.7 / AUT-285 — `AVCaptureDevice.authorizationStatus(for:)`
# for the real macOS camera + microphone permission probes. macOS-
# only — Linux + Windows keep the `Granted` stubs (no TCC equivalent
# for these two devices). The `AVMediaFormat` feature is what
# exposes the `AVMediaTypeVideo` / `AVMediaTypeAudio` constants
# `authorizationStatusForMediaType:` requires.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
    "block2",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGWindow",
] }
# M-PIX.9 — block2 closures for AVCaptureDevice requestAccess
# completion handler; objc2 runtime types for the Bool result.
block2 = "0.6"

[dev-dependencies]
# `test` feature enables `tauri::test::mock_builder` etc. for the IPC
# harness in `tests/commands.rs`. Note: cargo unifies dep + dev-dep
# features, so the release binary also gets the test module compiled in
# (a known cargo wart). The footprint is small enough to accept.
tauri = { version = "2", features = ["test", "protocol-asset"] }

[package.metadata.cargo-machete]
# `tauri::generate_context!()` uses the dep at macro-expansion time;
# machete's static analysis doesn't see that.
ignored = ["tauri"]
