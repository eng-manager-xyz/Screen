[package]
name = "wisp-storybook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Interactive feature gallery for the wisp 2D renderer."

[lints]
workspace = true

[lib]
name = "wisp_storybook"
path = "src/lib.rs"

[[bin]]
name = "wisp-storybook"
path = "src/main.rs"

# Headless story exporter — writes a PNG per story under
# `_docs/book/src/assets/wisp/<id>.png` for the mdBook site.
[[bin]]
name = "wisp-export-stories"
path = "src/bin/export_stories.rs"

# FlexibleText custom-font screenshot exporter — writes
# `_docs/book/src/assets/wisp/text-custom-fonts.png` demonstrating
# Inter + JetBrains Mono via FlexibleTextEngine + FlexibleTextRenderer.
# Sibling to wisp-export-stories because FlexibleTextRenderer lives
# outside the Stage / Renderer pipeline.
[[bin]]
name = "wisp-export-text-screenshots"
path = "src/bin/export_text_screenshots.rs"

# Animated-story video exporter. Renders animated stories (those
# with `tick: Some(...)`) to MP4 by piping raw RGBA frames into
# gst-launch-1.0. Local-only — gstreamer must be on PATH. CI doesn't
# run this binary; the committed .mp4 is the source of truth for the
# mdBook chapters' <video> tags.
[[bin]]
name = "wisp-export-animated"
path = "src/bin/export_animated.rs"

[dependencies]
wisp = { workspace = true }
# `media` produces typed geometry (e.g. `WaveformBarRect`) that wisp's
# graphics pipeline can render directly. wisp itself must not depend
# on media — this is a storybook-side composition only.
media = { path = "../media", version = "0.1.0" }
glam = { workspace = true }
wgpu = { workspace = true }
tracing-subscriber = { workspace = true }
# `default-features = false` strips eframe's `x11` + `wayland` features
# (which proxy through to `winit/x11` + `winit/wayland`); without them
# `cargo doc` on Linux trips winit's `compile_error!`. `cargo check
# --all-features` union-merges enough features to mask this from the
# rest of the gate, so the failure only surfaces in `just docs`.
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.31"
pollster = { workspace = true }
image = "0.25"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }

[package.metadata.cargo-machete]
# `tracing-subscriber` is used in the bin's main.rs (machete sometimes loses
# track when both lib + bin coexist).
ignored = ["tracing-subscriber"]
