<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>screen</title>

    <link data-trunk rel="rust" />
    <link data-trunk rel="copy-dir" href="../ui-storybook/assets" />
    <link rel="stylesheet" href="/assets/style.css" />
    <link rel="stylesheet" href="/shell.css" />
    <link data-trunk rel="copy-file" href="shell.css" />

    <!-- Tauri ↔ Leptos bridge.

         Inbound (Tauri → Leptos): Tauri 2's `window.__TAURI__.event`
         dispatches custom events from Rust. We re-emit each as a browser
         `CustomEvent` so Leptos can listen via `web_sys` without pulling
         a `tauri-sys` dependency. Two events today:
           - `file-dropped` (M-INT.2): payload is the dropped file path.
           - `player-status` (M-PLAY.2): payload is a `PlayerStatus` object
             (state / elapsed_ms / duration_ms / width / height / fps /
             frame_count). The browser CustomEvent's `.detail` is the
             same object — Leptos parses it via `serde_wasm_bindgen`.

         Outbound (Leptos → Tauri): three top-level helpers wrap
         `__TAURI__.core.invoke`. Leptos calls them via `extern "C"`
         declarations. Returning the underlying Promise is intentional —
         callers who want it can chain; callers who don't can ignore. -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (window.__TAURI__ && window.__TAURI__.event) {
          console.log("[screen bridge] __TAURI__.event found — registering listeners");
          window.__TAURI__.event.listen("file-dropped", (event) => {
            console.log("[screen bridge] file-dropped:", event.payload);
            window.dispatchEvent(new CustomEvent("file-dropped", {
              detail: event.payload
            }));
          });
          window.__TAURI__.event.listen("player-status", (event) => {
            window.dispatchEvent(new CustomEvent("player-status", {
              detail: event.payload
            }));
          });
          // Drag-state events (M-POLISH.1). Payload-less — the visual
          // toggle lives entirely in Leptos signal-land.
          window.__TAURI__.event.listen("file-drag-enter", () => {
            console.log("[screen bridge] file-drag-enter");
            window.dispatchEvent(new CustomEvent("file-drag-enter"));
          });
          window.__TAURI__.event.listen("file-drag-leave", () => {
            console.log("[screen bridge] file-drag-leave");
            window.dispatchEvent(new CustomEvent("file-drag-leave"));
          });
        } else {
          console.warn("[screen bridge] __TAURI__.event NOT found — running outside Tauri?");
        }
      });

      window.__screenOpen = (path) =>
        window.__TAURI__?.core?.invoke("player_open", { path });
      window.__screenPlay = () =>
        window.__TAURI__?.core?.invoke("player_play");
      window.__screenPause = () =>
        window.__TAURI__?.core?.invoke("player_pause");

      // M-CAM.2 / AUT-256 camera-IPC bridges. Each is a thin wrapper
      // around the Tauri invoke; consumed by Rust via the
      // `crate::camera_ipc` extern declarations.
      window.__screenListCameras = () =>
        window.__TAURI__?.core?.invoke("list_cameras") ?? Promise.resolve([]);
      window.__screenStartPreview = (cameraId) =>
        window.__TAURI__?.core?.invoke("start_preview", { cameraId }) ?? Promise.resolve();
      window.__screenStopPreview = () =>
        window.__TAURI__?.core?.invoke("stop_preview") ?? Promise.resolve();
      window.__screenCameraPermissionStatus = () =>
        window.__TAURI__?.core?.invoke("camera_permission_status") ?? Promise.resolve("Granted");

      // M-MIC.1 / AUT-278 + M-MIC.2 / AUT-279 — microphone IPC. Same
      // shape as the camera bridge so the picker UX (M-MIC.2) reads
      // identically across camera + mic.
      window.__screenListMicrophones = () =>
        window.__TAURI__?.core?.invoke("list_microphones") ?? Promise.resolve([]);
      window.__screenStartMicCapture = (micId) =>
        window.__TAURI__?.core?.invoke("start_mic_capture", { micId }) ?? Promise.resolve();
      window.__screenStopMicCapture = () =>
        window.__TAURI__?.core?.invoke("stop_mic_capture") ?? Promise.resolve();
      window.__screenMicStatus = () =>
        window.__TAURI__?.core?.invoke("mic_status") ?? Promise.resolve("Idle");
      window.__screenMicrophonePermissionStatus = () =>
        window.__TAURI__?.core?.invoke("microphone_permission_status") ?? Promise.resolve("Granted");

      // M-RECP.0 / AUT-261 (camera), M-RECP.6 / AUT-272 (screen),
      // M-RECP.8 / AUT-286 (microphone) — Settings deep-links.
      // Each returns a Promise that resolves on successful spawn or
      // rejects with the spawn-error string. Linux is a no-op (no
      // universal Settings deep-link); macOS + Windows shell out via
      // `open` / `cmd /c start` respectively.
      window.__screenOpenSettingsCamera = () =>
        window.__TAURI__?.core?.invoke("open_settings_camera") ?? Promise.resolve();
      window.__screenOpenSettingsMicrophone = () =>
        window.__TAURI__?.core?.invoke("open_settings_microphone") ?? Promise.resolve();
      window.__screenOpenSettingsScreenRecording = () =>
        window.__TAURI__?.core?.invoke("open_settings_screen_recording") ?? Promise.resolve();

      // M-AUDIO-SYS.2 / AUT-282 — system audio (speakers + per-app)
      // IPC. Same shape as the camera / mic bridge; the per-app
      // filter accepts a tagged enum: `{ AllAudio: null }` /
      // `{ OnlyApps: ["com.spotify.client", ...] }` /
      // `{ ExcludeApps: ["us.zoom.xos"] }`. Tauri's serde decoder
      // accepts both tagged-string and tagged-object forms; the
      // picker emits whichever is more convenient.
      window.__screenListAudioApps = () =>
        window.__TAURI__?.core?.invoke("list_audio_apps") ?? Promise.resolve([]);
      window.__screenStartSystemAudio = () =>
        window.__TAURI__?.core?.invoke("start_system_audio_capture") ?? Promise.resolve();
      window.__screenStopSystemAudio = () =>
        window.__TAURI__?.core?.invoke("stop_system_audio_capture") ?? Promise.resolve();
      window.__screenSetSystemAudioFilter = (filter) =>
        window.__TAURI__?.core?.invoke("set_system_audio_filter", { filter }) ?? Promise.resolve();
      window.__screenSystemAudioStatus = () =>
        window.__TAURI__?.core?.invoke("system_audio_status") ?? Promise.resolve(false);

      // M-SCK.1/.2/.4 / AUT-268/269/271 — screen video capture IPC.
      window.__screenListScreenDisplays = () =>
        window.__TAURI__?.core?.invoke("list_screen_displays") ?? Promise.resolve([]);
      window.__screenListScreenWindows = () =>
        window.__TAURI__?.core?.invoke("list_screen_windows") ?? Promise.resolve([]);
      window.__screenStartScreenCapture = () =>
        window.__TAURI__?.core?.invoke("start_screen_capture") ?? Promise.resolve();
      window.__screenStopScreenCapture = () =>
        window.__TAURI__?.core?.invoke("stop_screen_capture") ?? Promise.resolve();
      window.__screenScreenCaptureStatus = () =>
        window.__TAURI__?.core?.invoke("screen_capture_status") ?? Promise.resolve(false);
      window.__screenScreenCaptureFrameCount = () =>
        window.__TAURI__?.core?.invoke("screen_capture_frame_count") ?? Promise.resolve(0);

      // M-CAM.3 diagnostic / AUT-257 — poll the camera-pipeline
      // counters. Leptos calls this every 500ms while the Recorder
      // surface is open to render the small "Camera pipeline" overlay.
      window.__screenPreviewDiagnostics = () =>
        window.__TAURI__?.core?.invoke("preview_diagnostics") ?? Promise.resolve(null);

      // Synchronous helper: turn a local file path into an asset:// URL
      // the webview's <video> element can load. Tauri 2 exposes this via
      // `__TAURI__.core.convertFileSrc`. Returns undefined when running
      // outside Tauri (so the Rust side can fall through to its own
      // fallback for the `trunk serve` standalone path).
      window.__screenConvertFileSrc = (path) =>
        window.__TAURI__?.core?.convertFileSrc?.(path);

      // M-BUBBLE.0 / AUT-273 — toggle the borderless webcam-bubble
      // window. Returns the underlying Promise (resolves to undefined)
      // so the Rust caller can await + log failures without surfacing
      // them to the user.
      window.__screenToggleBubble = () =>
        window.__TAURI__?.core?.invoke("toggle_webcam_bubble") ?? Promise.resolve();

      // M-BUBBLE.1 v0 / AUT-274 — whole-window click-through toggle.
      // When `enabled = true`, the bubble window passes mouse events
      // to whatever's underneath (the bubble cannot be dragged or
      // clicked while in this mode). Disable from the AppShell's
      // "Click-through bubble" toggle (the only out-of-band path).
      window.__screenSetBubbleClickthrough = (enabled) =>
        window.__TAURI__?.core?.invoke("set_bubble_clickthrough", { enabled }) ?? Promise.resolve();
    </script>
  </head>
  <body>
    <noscript>This is the Leptos UI. Run `trunk serve` from
      `crates/app-ui/` (or launch via `cd crates/app && cargo tauri dev`).</noscript>
  </body>
</html>
