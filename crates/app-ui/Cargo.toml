[package]
name = "app-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos CSR app — the recorder shell's HTML/UI layer, served into the Tauri webview by Trunk."

[lints]
workspace = true

[lib]
name = "app_ui"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# M-TRAY.1 / AUT-250 — gate the AppShell CSR-preview mount path. When
# enabled, `run()` mounts a minimal `AppShell` with shipped fixtures
# instead of the default drop-zone flow. Used by `just dev-appshell`
# (and the CI wasm32 build smoke) to prove the shell tree mounts +
# paints under CSR before M-TRAY.3 wires it for real.
tray-appshell-preview = []

[dependencies]
leptos = { version = "0.8", default-features = false, features = ["csr"] }
ui-storybook = { path = "../ui-storybook", default-features = false, features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# M-AUDIO.METER / AUT-287 — js-sys's Reflect + Function bindings are
# needed for the `tauri.event.listen` subscription path used by the
# mic + system-audio level meters. wasm-bindgen pulls js-sys
# transitively but the explicit dep is what makes `js_sys::Reflect`
# importable.
js-sys = "0.3"
web-sys = { version = "0.3", features = ["CustomEvent", "Window", "Location", "History", "Storage", "EventTarget", "Event", "HtmlVideoElement", "HtmlMediaElement", "console"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# M-AUDIO-SYS.2 / AUT-282 — system_audio_picker persists a
# `Vec<String>` of selected bundle ids to LocalStorage; serde_json
# is the simplest serialiser for the JSON-string round-trip. Promoted
# from dev-dep to a regular dep since the runtime path uses it.
serde_json = "1"

[dev-dependencies]
