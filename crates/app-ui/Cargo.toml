[package]
name = "app-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos CSR app — the recorder shell's HTML/UI layer, served into the Tauri webview by Trunk."

[lints]
workspace = true

[lib]
name = "app_ui"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# M-TRAY.1 / AUT-250 — gate the AppShell CSR-preview mount path. When
# enabled, `run()` mounts a minimal `AppShell` with shipped fixtures
# instead of the default drop-zone flow. Used by `just dev-appshell`
# (and the CI wasm32 build smoke) to prove the shell tree mounts +
# paints under CSR before M-TRAY.3 wires it for real.
tray-appshell-preview = []

[dependencies]
leptos = { version = "0.8", default-features = false, features = ["csr"] }
# M-QUAL.4 — Lucide icons (LuPause / LuSettings / LuCamera …) for the
# webcam-bubble chrome, rendered as inline SVG via leptos_icons' `Icon`
# component. `icondata` carries the icon path data; `leptos_icons`
# 0.7 targets leptos 0.8. Unused icons are dead-code-eliminated from
# the wasm bundle (only the consts we reference are kept).
leptos_icons = "0.7"
# Lucide-only: `icondata`'s default features pull in EVERY icon set
# (dozens of subcrates → slow build + heavy wasm). We only use `Lu*`
# glyphs, so gate to the `lucide` set.
icondata = { version = "0.7", default-features = false, features = ["lucide"] }
ui-storybook = { path = "../ui-storybook", default-features = false, features = ["csr"] }
# ED.5 / M-EDIT — the pure edit model. `edit` is serde-only (no wgpu /
# GStreamer), so it compiles to wasm32 cleanly and the `open_in_editor`
# command's payload deserializes straight into `edit::EditProject`.
edit = { path = "../edit" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
# M-AUDIO.METER / AUT-287 — js-sys's Reflect + Function bindings are
# needed for the `tauri.event.listen` subscription path used by the
# mic + system-audio level meters. wasm-bindgen pulls js-sys
# transitively but the explicit dep is what makes `js_sys::Reflect`
# importable.
js-sys = "0.3"
# M-AUDIO-SYS.3 / AUT-288 — debounce rapid checkbox toggling on the
# system-audio picker so SCK's updateContentFilter doesn't rebuild
# the stream 5 times when the user clicks 5 checkboxes quickly.
gloo-timers = "0.3"
web-sys = { version = "0.3", features = ["CustomEvent", "Window", "Location", "History", "Storage", "EventTarget", "Event", "HtmlVideoElement", "HtmlMediaElement", "HtmlCanvasElement", "HtmlSelectElement", "CanvasRenderingContext2d", "ImageData", "Document", "console", "KeyboardEvent", "HtmlInputElement"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# M-AUDIO-SYS.2 / AUT-282 — system_audio_picker persists a
# `Vec<String>` of selected bundle ids to LocalStorage; serde_json
# is the simplest serialiser for the JSON-string round-trip. Promoted
# from dev-dep to a regular dep since the runtime path uses it.
serde_json = "1"

[dev-dependencies]
