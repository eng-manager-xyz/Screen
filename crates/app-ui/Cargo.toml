[package]
name = "app-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos CSR app — the recorder shell's HTML/UI layer, served into the Tauri webview by Trunk."

[lints]
workspace = true

[lib]
name = "app_ui"
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.7", default-features = false, features = ["csr"] }
ui-storybook = { path = "../ui-storybook", default-features = false, features = ["csr"] }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["CustomEvent", "Window", "EventTarget", "Event", "HtmlVideoElement", "HtmlMediaElement"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
