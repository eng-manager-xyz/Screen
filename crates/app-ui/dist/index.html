    <!-- Tauri ↔ Leptos bridge.
         Tauri 2's JS API (window.__TAURI__.event) dispatches `file-dropped`
         when the OS drops a file on the window. We re-emit that as a
         browser `CustomEvent("file-dropped")` so Leptos can listen via
         `web_sys::EventTarget::add_event_listener_with_callback` without
         pulling in any tauri-sys dependency. -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (window.__TAURI__ && window.__TAURI__.event) {
          window.__TAURI__.event.listen("file-dropped", (event) => {
            window.dispatchEvent(new CustomEvent("file-dropped", {
              detail: event.payload
            }));
          });
        }
      });
    </script>
