    <!-- Tauri ↔ Leptos bridge.

         Inbound (Tauri → Leptos): Tauri 2's `window.__TAURI__.event`
         dispatches custom events from Rust. We re-emit each as a browser
         `CustomEvent` so Leptos can listen via `web_sys` without pulling
         a `tauri-sys` dependency. Two events today:
           - `file-dropped` (M-INT.2): payload is the dropped file path.
           - `player-status` (M-PLAY.2): payload is a `PlayerStatus` object
             (state / elapsed_ms / duration_ms / width / height / fps /
             frame_count). The browser CustomEvent's `.detail` is the
             same object — Leptos parses it via `serde_wasm_bindgen`.

         Outbound (Leptos → Tauri): three top-level helpers wrap
         `__TAURI__.core.invoke`. Leptos calls them via `extern "C"`
         declarations. Returning the underlying Promise is intentional —
         callers who want it can chain; callers who don't can ignore. -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (window.__TAURI__ && window.__TAURI__.event) {
          console.log("[screen bridge] __TAURI__.event found — registering listeners");
          window.__TAURI__.event.listen("file-dropped", (event) => {
            console.log("[screen bridge] file-dropped:", event.payload);
            window.dispatchEvent(new CustomEvent("file-dropped", {
              detail: event.payload
            }));
          });
          window.__TAURI__.event.listen("player-status", (event) => {
            window.dispatchEvent(new CustomEvent("player-status", {
              detail: event.payload
            }));
          });
          // Drag-state events (M-POLISH.1). Payload-less — the visual
          // toggle lives entirely in Leptos signal-land.
          window.__TAURI__.event.listen("file-drag-enter", () => {
            console.log("[screen bridge] file-drag-enter");
            window.dispatchEvent(new CustomEvent("file-drag-enter"));
          });
          window.__TAURI__.event.listen("file-drag-leave", () => {
            console.log("[screen bridge] file-drag-leave");
            window.dispatchEvent(new CustomEvent("file-drag-leave"));
          });
        } else {
          console.warn("[screen bridge] __TAURI__.event NOT found — running outside Tauri?");
        }
      });

      window.__screenOpen = (path) =>
        window.__TAURI__?.core?.invoke("player_open", { path });
      window.__screenPlay = () =>
        window.__TAURI__?.core?.invoke("player_play");
      window.__screenPause = () =>
        window.__TAURI__?.core?.invoke("player_pause");

      // Synchronous helper: turn a local file path into an asset:// URL
      // the webview's <video> element can load. Tauri 2 exposes this via
      // `__TAURI__.core.convertFileSrc`. Returns undefined when running
      // outside Tauri (so the Rust side can fall through to its own
      // fallback for the `trunk serve` standalone path).
      window.__screenConvertFileSrc = (path) =>
        window.__TAURI__?.core?.convertFileSrc?.(path);
    </script>

    <noscript>This is the Leptos UI. Run `trunk serve` from

  <script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>
