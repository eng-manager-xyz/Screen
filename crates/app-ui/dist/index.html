    <!-- Tauri ↔ Leptos bridge.

         Inbound (Tauri → Leptos): Tauri 2's `window.__TAURI__.event`
         dispatches custom events from Rust. We re-emit each as a browser
         `CustomEvent` so Leptos can listen via `web_sys` without pulling
         a `tauri-sys` dependency. Two events today:
           - `file-dropped` (M-INT.2): payload is the dropped file path.
           - `player-status` (M-PLAY.2): payload is a `PlayerStatus` object
             (state / elapsed_ms / duration_ms / width / height / fps /
             frame_count). The browser CustomEvent's `.detail` is the
             same object — Leptos parses it via `serde_wasm_bindgen`.

         Outbound (Leptos → Tauri): three top-level helpers wrap
         `__TAURI__.core.invoke`. Leptos calls them via `extern "C"`
         declarations. Returning the underlying Promise is intentional —
         callers who want it can chain; callers who don't can ignore. -->
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        if (window.__TAURI__ && window.__TAURI__.event) {
          window.__TAURI__.event.listen("file-dropped", (event) => {
            window.dispatchEvent(new CustomEvent("file-dropped", {
              detail: event.payload
            }));
          });
          window.__TAURI__.event.listen("player-status", (event) => {
            window.dispatchEvent(new CustomEvent("player-status", {
              detail: event.payload
            }));
          });
        }
      });

      window.__screenOpen = (path) =>
        window.__TAURI__?.core?.invoke("player_open", { path });
      window.__screenPlay = () =>
        window.__TAURI__?.core?.invoke("player_play");
      window.__screenPause = () =>
        window.__TAURI__?.core?.invoke("player_pause");
    </script>
