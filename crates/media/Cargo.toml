[package]
name = "media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GStreamer-backed audio + video capture/playback and data models. Hands typed media data to wisp; wisp never depends on this crate's GStreamer integration."

[lints]
workspace = true

[lib]
name = "media"
path = "src/lib.rs"

[dependencies]
decode = { path = "../decode", version = "0.1.0" }
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
image = "0.25"
tracing-subscriber = { workspace = true }
# Examples only — `gst_video_to_wisp` boots a headless wisp Application
# and renders captured frames to PNG. The `media` library itself stays
# wgpu-free; this dep is dev-only and never re-exported.
wisp = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
glam = { workspace = true }

# mdBook visual asset generator — renders the waveform / histogram /
# capture PNGs that the media chapters embed. Local-only (depends on
# gstreamer + the bundled MP3 fixture); CI consumes the committed
# PNGs.
[[example]]
name = "render-mdbook-assets"
path = "examples/render_mdbook_assets.rs"

# M-MEDIA.11 / AUT-107 — capture audio from `audiotestsrc` through the
# CLI-pipe GStreamer wrapper, quantize, and print bucket / RMS / peak
# stats. Skips when gstreamer isn't on PATH.
[[example]]
name = "gst_audio_histogram"
path = "examples/gst_audio_histogram.rs"

# M-MEDIA.13 / AUT-109 — capture frames from `videotestsrc`, upload to
# wisp `VideoTexture`, render through `Sprite`, save PNGs. Skips when
# gstreamer isn't on PATH.
[[example]]
name = "gst_video_to_wisp"
path = "examples/gst_video_to_wisp.rs"
