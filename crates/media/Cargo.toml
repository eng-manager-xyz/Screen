[package]
name = "media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "GStreamer-backed audio + video capture/playback and data models. Hands typed media data to wisp; wisp never depends on this crate's GStreamer integration."

[lints]
workspace = true

[lib]
name = "media"
path = "src/lib.rs"

[dependencies]
decode = { path = "../decode", version = "0.1.0" }
thiserror = "2"
tracing = { workspace = true }
# M-CAM.1 / AUT-255 — `CameraDevice` serializes across the Tauri seam
# in M-CAM.2 (AUT-256), so serde stays in the main deps.
serde = { version = "1", features = ["derive"] }

# M-AUDIO-SYS.0 / AUT-280 — macOS ScreenCaptureKit bindings for system
# audio capture (and, in M-AUDIO-SYS.1, per-app filtering). Pulled in
# only on macOS: every dep here is cfg-gated to that target so Linux /
# Windows builds don't pay the build cost. The runtime floor is macOS
# 13.0 because SCStreamConfiguration.capturesAudio is a 13+ API;
# Info.plist's LSMinimumSystemVersion is bumped to 13.0 alongside this.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
    "NSArray",
    "NSError",
    "NSString",
    "NSValue",
    "NSObject",
    "NSThread",
    "NSEnumerator",
] }
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "SCShareableContent",
    "SCStream",
    "SCError",
    "block2",
    "dispatch2",
    "libc",
    "objc2-core-media",
    # M-SCK.1 / AUT-268 — SCDisplay::displayID / SCWindow::windowID
    # are gated on `objc2-core-graphics`; SCDisplay::frame /
    # SCWindow::frame on `objc2-core-foundation`.
    "objc2-core-graphics",
    "objc2-core-foundation",
] }
objc2-core-media = { version = "0.3", features = [
    "CMSampleBuffer",
    "CMBlockBuffer",
    "CMFormatDescription",
    "CMBase",
] }
objc2-core-audio-types = { version = "0.3", features = ["CoreAudioBaseTypes"] }
block2 = "0.6"
dispatch2 = "0.3"

[dev-dependencies]
image = "0.25"
tracing-subscriber = { workspace = true }
# M-CAM.1 serde round-trip test for `CameraDevice`.
serde_json = "1"
# Examples only — `gst_video_to_wisp` boots a headless wisp Application
# and renders captured frames to PNG. The `media` library itself stays
# wgpu-free; this dep is dev-only and never re-exported.
wisp = { workspace = true }
wgpu = { workspace = true }
pollster = { workspace = true }
glam = { workspace = true }

# mdBook visual asset generator — renders the waveform / histogram /
# capture PNGs that the media chapters embed. Local-only (depends on
# gstreamer + the bundled MP3 fixture); CI consumes the committed
# PNGs.
[[example]]
name = "render-mdbook-assets"
path = "examples/render_mdbook_assets.rs"

# M-MEDIA.11 / AUT-107 — capture audio from `audiotestsrc` through the
# CLI-pipe GStreamer wrapper, quantize, and print bucket / RMS / peak
# stats. Skips when gstreamer isn't on PATH.
[[example]]
name = "gst_audio_histogram"
path = "examples/gst_audio_histogram.rs"

# M-MEDIA.13 / AUT-109 — capture frames from `videotestsrc`, upload to
# wisp `VideoTexture`, render through `Sprite`, save PNGs. Skips when
# gstreamer isn't on PATH.
[[example]]
name = "gst_video_to_wisp"
path = "examples/gst_video_to_wisp.rs"

# M-MEDIA.14 / AUT-110 — capstone P1 example: synthetic video + audio
# histogram in one wisp scene, driven by a shared MediaClock. Pure
# synthetic so the frame sequence is reproducible.
[[example]]
name = "synced_scene"
path = "examples/synced_scene.rs"

# M-MIC.0 / AUT-277 — print every attached microphone via
# gst-device-monitor-1.0 Audio/Source. Exits cleanly with a hint
# when gstreamer isn't on PATH or no inputs are attached.
[[example]]
name = "list_microphones"
path = "examples/list_microphones.rs"

# M-AUDIO-SYS.0 / AUT-280 — capture 1 second of macOS speaker
# output via ScreenCaptureKit, print peak + RMS. Triggers the
# Screen Recording permission prompt on first run. macOS-only;
# Linux/Windows builds print a skip message.
[[example]]
name = "system_audio_smoke"
path = "examples/system_audio_smoke.rs"

# M-AUDIO-SYS.1 / AUT-281 — list every running app SCK can see,
# with bundle id + display name + PID. Drives the per-app audio
# filter (Spotify-only capture etc.). macOS-only; same TCC entry
# as system_audio_smoke.
[[example]]
name = "list_audio_apps"
path = "examples/list_audio_apps.rs"

# M-SCK.1 / AUT-268 — list every display + visible window SCK can
# see. Drives the screen-source picker (M-SCK.4). macOS-only; same
# Screen Recording TCC entry as the rest of SCK.
[[example]]
name = "list_screen_sources"
path = "examples/list_screen_sources.rs"

# M-SCK.0 / AUT-267 — open an SCStream on the primary display + observe
# the frame counter for 2 seconds. Verifies the SCK video-capture
# pipeline reaches Rust end-to-end without yet doing pixel
# extraction (data-delivery is a separate ticket).
[[example]]
name = "screen_capture_smoke"
path = "examples/screen_capture_smoke.rs"
