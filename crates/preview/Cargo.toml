[package]
name = "preview"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Native winit window with a wgpu surface that wisp renders into. Plays an MP4 end-to-end through the decode → playback → wisp stack."

[lints]
workspace = true

[[bin]]
name = "preview"
path = "src/main.rs"

[dependencies]
wisp = { workspace = true }
decode = { path = "../decode" }
playback = { path = "../playback" }
glam = { workspace = true }
wgpu = { workspace = true }
winit = { version = "0.30", features = ["x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita"] }
pollster = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
