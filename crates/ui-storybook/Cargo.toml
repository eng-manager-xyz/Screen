[package]
name = "ui-storybook"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Leptos-based UI component gallery (parallels wisp-storybook for the HTML/CSS side)."

[lints]
workspace = true

[lib]
name = "ui_storybook"
path = "src/lib.rs"

# Headless story exporter — writes a standalone HTML file per story under
# `_docs/book/src/assets/ui/<id>.html` for the mdBook site.
[[bin]]
name = "ui-export-stories"
path = "src/bin/export_stories.rs"
required-features = ["ssr"]

# Long-lived JSON-IPC worker that re-renders story subsets without re-linking
# between iterations. Wired into the dev-server watcher under DEV-07.
[[bin]]
name = "render-worker"
path = "src/bin/render_worker.rs"
required-features = ["ssr"]

[features]
# `ssr` is the default so `cargo check` / `cargo test` work on a native target
# without Trunk or the wasm toolchain. Browser-side serving via Trunk is a
# separate path (use `--no-default-features --features csr` for that).
default = ["ssr"]
ssr = ["leptos/ssr"]
csr = ["leptos/csr"]

[dependencies]
leptos = { version = "0.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1", features = ["yaml"] }
tempfile = "3"
