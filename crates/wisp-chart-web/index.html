<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wisp-chart — WebGPU demo</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <style>
      :root {
        color-scheme: light;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #ffffff;
        color: #222222;
      }
      header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #e5e5e5;
        display: none;
      }
      body.standalone header {
        display: block;
      }
      header h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 600;
      }
      header p {
        margin: 0.25rem 0 0;
        font-size: 0.85rem;
        color: #666;
      }
      main {
        padding: 0;
      }
      body.standalone main {
        padding: 1.5rem;
      }
      /* Canvas sized via CSS to fill its container. The actual
         WebGPU surface backing it is set by the wasm bring-up
         using canvas.width / canvas.height (intrinsic pixels). */
      #wisp-chart-canvas {
        display: block;
        width: 100%;
        height: 100%;
        background: #fafafa;
        box-sizing: border-box;
      }
      #status {
        margin-top: 0.5rem;
        font-size: 0.85rem;
        color: #888;
      }
      #status[data-state="error"] {
        color: #d55e00;
      }
      body.standalone #status {
        margin: 1rem 1.5rem 0;
      }
      noscript {
        color: #d55e00;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>wisp-chart — WebGPU demo</h1>
      <p>
        Native Rust → WebAssembly → wgpu (BROWSER_WEBGPU) → HTML canvas. Use
        <code>?chart=&lt;id&gt;</code> to swap demos. Known ids: gantt, bar,
        line, grouped-bar, stacked-bar, scatter, bubble, area,
        connected-scatter, kpi, gauge, bullet.
      </p>
    </header>
    <main>
      <noscript>This demo requires JavaScript + WebGPU.</noscript>
      <canvas id="wisp-chart-canvas" width="960" height="640"></canvas>
      <p id="status">Loading wisp-chart-web.wasm…</p>
    </main>
    <script>
      // Lightweight WebGPU probe + standalone-vs-iframe detection.
      // - When loaded as the top page (no parent), enable the
      //   header + padding for a friendly standalone view.
      // - When loaded inside an <iframe>, strip the chrome so the
      //   chart is the only thing rendered.
      (function () {
        if (window.self === window.top) {
          document.body.classList.add("standalone");
        }
        const status = document.getElementById("status");
        if (!navigator.gpu) {
          status.textContent =
            "WebGPU is not available in this browser. Use Chrome / Edge 113+ or Firefox 121+.";
          status.dataset.state = "error";
          return;
        }
        status.textContent = "WebGPU available — initializing wgpu…";
      })();
    </script>
  </body>
</html>
