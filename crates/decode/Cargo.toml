[package]
name = "decode"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Video decode → BGRA frames; trait-based so wisp can consume any source (mock, AVFoundation, ffmpeg, …) uniformly."

[lints]
workspace = true

[lib]
name = "decode"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
tracing = { workspace = true }

[dev-dependencies]
# Shared, structured GStreamer probe (M-MEDIA.1 / AUT-97). media
# depends on decode for VideoFrame, so this is a dev-only edge —
# decode's normal build doesn't pull media.
media = { path = "../media", version = "0.1.0" }
