# cargo-deny — license, advisory, source, and ban policies.
# Run with: `just deny` or `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # paste is unmaintained (not vulnerable). Transitive via metal → wgpu-hal → wgpu.
    # See _docs/ISSUES.md ISS-01. Re-evaluate when wgpu drops the metal/paste path.
    { id = "RUSTSEC-2024-0436", reason = "transitive via wgpu-hal; no upstream fix yet; unmaintained-only, not a vulnerability" },
    # gtk-rs GTK3 family — Tauri 2's Linux backend pulls these. Archived upstream;
    # Tauri tracks migration. All unmaintained-only (no exploit). See ISS-02.
    { id = "RUSTSEC-2024-0370", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0411", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0412", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0413", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0414", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0415", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0416", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0417", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0418", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0419", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2024-0420", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2025-0075", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2025-0080", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2025-0081", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2025-0098", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
    { id = "RUSTSEC-2025-0100", reason = "transitive via Tauri 2 Linux backend; unmaintained-only" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    # Fonts in the egui ecosystem (epaint_default_fonts → Open Sans, Hack, etc.)
    "OFL-1.1",
    "Ubuntu-font-1.0",
    # University of Illinois/NCSA Open Source License — permissive (MIT-like).
    # Pulled in via image → ravif → rav1e → libfuzzer-sys under --all-features.
    # Pre-existing in the tree; surfaced when expanding the dep graph for
    # cosmic-text (M-TEXT.2 / AUT-76).
    "NCSA",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
