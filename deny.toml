# cargo-deny — license, advisory, source, and ban policies.
# Run with: `just deny` or `cargo deny check`.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
ignore = [
    # paste is unmaintained (not vulnerable). Transitive via metal → wgpu-hal → wgpu.
    # See _docs/ISSUES.md ISS-01. Re-evaluate when wgpu drops the metal/paste path.
    { id = "RUSTSEC-2024-0436", reason = "transitive via wgpu-hal; no upstream fix yet; unmaintained-only, not a vulnerability" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    # Fonts in the egui ecosystem (epaint_default_fonts → Open Sans, Hack, etc.)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
